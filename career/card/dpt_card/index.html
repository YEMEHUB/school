<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>직업기능유형 DPT 카드 선택 활동</title>
<style>
:root{--d:#1d8eaa;--p:#f4b321;--t:#e84b83;--back:#d9d5d2;--ink:#343434}
*{box-sizing:border-box}body{margin:0;font-family:Pretendard,'Noto Sans KR',Arial,sans-serif;background:#f6f7fb;color:var(--ink)}
header{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #ddd;padding:14px 18px;box-shadow:0 2px 8px #0001}
h1{margin:0;font-size:22px}.sub{margin:6px 0 0;color:#666;font-size:14px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
button{border:0;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer;background:#263449;color:white}button.light{background:#e9edf4;color:#263449}.pill{padding:8px 12px;background:#f1f3f7;border-radius:999px;font-weight:800}.warn{color:#d73737;font-weight:800}
main{padding:16px;max-width:1540px;margin:auto}.board{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:12px;align-items:start}.cardWrap{perspective:900px;aspect-ratio:5/8.5;position:relative;min-width:0}.card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.75,.2,1)}.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;box-shadow:0 6px 14px #0002;overflow:hidden;border:1px solid #cfcfcf}.front{transform:rotateY(180deg)}
/* 회색 설명 면 */
.back{background:linear-gradient(135deg,#ece9e5,#d1ccc8);padding:22px 16px;display:flex;flex-direction:column}.back::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#fff2 0 2px,#00000006 2px 4px);pointer-events:none}.backTitle{font-size:23px;font-weight:900;line-height:1.05;margin-top:2px}.backEng{font-size:15px;color:#777;font-weight:800;margin-top:2px}.wave{height:1px;margin:12px 0 14px;background:#7b7773;opacity:.55}.desc{font-size:12.8px;line-height:1.58;word-break:keep-all;color:#333}.typeTag{display:none}
/* 색깔 공개 면 */
.front.d{background:linear-gradient(160deg,#2eb3d5,#14758e)}.front.p{background:linear-gradient(160deg,#ffdc55,#eca51b)}.front.t{background:linear-gradient(160deg,#ff76a7,#d94178)}
.topPanel{position:absolute;left:9%;right:9%;top:6%;height:21%;border-radius:14px;padding:11px 13px;color:white;font-weight:900;font-size:25px;line-height:1;background:#00000018}.topPanel span{display:block;font-size:15px;opacity:.82;margin-top:3px}.front.p .topPanel{background:#cc7c251c}.front.d .topPanel{background:#05556f22}.front.t .topPanel{background:#a8175022}
.inner{position:absolute;left:9%;right:9%;top:30%;height:30%;background:#fff;border-radius:14px;padding:10px 10px;display:grid;grid-template-rows:auto 1fr;align-items:center}.cardName{font-size:15.5px;font-weight:900;line-height:1.15;color:#222;word-break:keep-all}.icon{font-size:37px;align-self:center;justify-self:center;line-height:1;margin-top:2px}.marks{display:none}.front .bottom{position:absolute;left:9%;right:9%;bottom:5%;height:30%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10.8px;line-height:1.52;text-align:center;word-break:keep-all;font-weight:700}.selected .face{outline:4px solid #2937ff;outline-offset:3px}.badge{position:absolute;right:8px;top:8px;background:#2937ff;color:#fff;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:900;z-index:5;box-shadow:0 2px 6px #0002}.hidden{display:none!important}
.result{margin-top:24px;background:#fff;border-radius:18px;padding:18px;box-shadow:0 6px 16px #0001}.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.box{border:1px solid #ddd;border-radius:14px;padding:14px}.box h3{margin:0 0 8px}.dtxt{color:#16758e}.ptxt{color:#c17d00}.ttxt{color:#c32f68}ol{margin:6px 0 0 22px;padding:0}li{margin:4px 0}.help{font-size:13px;color:#666;margin-top:8px}
@media(max-width:980px){main{padding:12px}.board{grid-template-columns:repeat(4,1fr);gap:10px}
}
@media(max-width:560px){main{padding:12px}.board{grid-template-columns:repeat(3,1fr);gap:10px}.back{padding:11px 10px}.backTitle{font-size:18px}.backEng{font-size:12px}.desc{font-size:9.8px}.wave{margin:8px 0 10px}.cardName{font-size:12.5px}.icon{font-size:32px}.topPanel{font-size:19px;padding:8px 10px}.topPanel span{font-size:12px}.front .bottom{font-size:7.8px}.badge{font-size:10px;padding:4px 6px}}
</style>
</head><body>
<header><h1>직업기능유형 카드 선택 활동</h1><div class="sub">회색 뒷면의 기능 설명만 보고 마음에 드는 카드 8장을 선택하세요. 선택하면 앞면이 열리며 D/P/T 유형이 공개됩니다.</div><div class="bar"><button id="shuffle">카드 섞기</button><button id="reset" class="light">처음부터</button><span class="pill">선택: <b id="count">0</b>/8</span><span class="pill">유형: <b id="code">-</b></span><span id="msg" class="warn"></span></div></header>
<main><section id="board" class="board"></section><section class="result"><h2>선택 결과</h2><div class="cols"><div class="box"><h3 class="dtxt">자료 D <span id="dc">0</span>개</h3><ol id="dlist"></ol></div><div class="box"><h3 class="ptxt">사람 P <span id="pc">0</span>개</h3><ol id="plist"></ol></div><div class="box"><h3 class="ttxt">사물 T <span id="tc">0</span>개</h3><ol id="tlist"></ol></div></div><div class="help">동점일 때는 먼저 선택한 카드가 있는 유형을 앞에 배치했습니다.</div></section></main>
<script>
const cards=[
{type:'D',num:1,ko:'종합하다',en:'synthesizing',desc:'데이터(사실, 지식, 행동, 글 등)의 의미를 이해하고 판단하여 자료를 합치거나 원리에 따라 정리한다.',icon:'⚙️'},
{type:'D',num:2,ko:'조정하다',en:'coordinating',desc:'데이터의 분석에 기초하여 시간, 장소, 작업순서, 활동 등을 기준에 맞도록 조절하여 정도나 상황을 보고한다.',icon:'✅'},
{type:'D',num:3,ko:'분석하다',en:'analyzing',desc:'복잡한 현상을 조사하고 평가하며 다양한 각도로 풀어서 밝힌다.',icon:'💡'},
{type:'D',num:4,ko:'수집하다',en:'compiling',desc:'정보를 찾아 모으고 종류에 따라 구분한다.',icon:'📁'},
{type:'D',num:5,ko:'계산하다',en:'computing',desc:'사칙연산(덧셈, 뺄셈, 곱셈, 나눗셈)을 실시하고 사칙연산과 관련하여 활동하거나 보고한다.',icon:'🧮'},
{type:'D',num:6,ko:'기록하다',en:'copying',desc:'데이터를 옮겨 적거나 입력하거나 표시한다.',icon:'📋'},
{type:'D',num:7,ko:'비교하다',en:'comparing',desc:'쉽게 관찰되는 공통점이나 차이점을 살피고 판단한다.',icon:'🏢'},
{type:'P',num:1,ko:'자문하다',en:'mentoring',desc:'전문적인 방법에 따라 사람들의 문제를 상담하고 조언하며 해결책을 제시한다.',icon:'🤝'},
{type:'P',num:2,ko:'협의하다',en:'negotiating',desc:'정책을 수립하거나 의사결정을 하기 위해 생각이나 정보, 의견 등을 교환한다.',icon:'🧑‍💼'},
{type:'P',num:3,ko:'교육하다',en:'instructing',desc:'설명이나 실습 등을 통해 어떤 주제에 대해 가르치거나 훈련시킨다.',icon:'🖥️'},
{type:'P',num:4,ko:'감독하다',en:'supervising',desc:'작업방법을 결정하거나 작업자들에게 개인별 업무를 배정하고 관리한다.',icon:'📣'},
{type:'P',num:5,ko:'공연하다',en:'diverting',desc:'무대공연이나 영화, TV, 라디오 등을 통해 사람들을 즐겁게 한다.',icon:'🎻'},
{type:'P',num:6,ko:'설득하다',en:'persuading',desc:'정보를 전달하거나 상품이나 서비스 등을 구매하도록 권유하고 설명한다.',icon:'📝'},
{type:'P',num:7,ko:'봉사하다',en:'serving',desc:'사람들의 요구 또는 필요를 파악하여 즉시 제공한다.',icon:'📦'},
{type:'T',num:1,ko:'설치하다',en:'setting up',desc:'기계나 설비 등을 준비하고 조정하여 기계가 작동할 수 있도록 처음부터 구성하고 실행한다.',icon:'💾'},
{type:'T',num:2,ko:'정밀작업하다',en:'precision working',desc:'설정된 기준치를 달성하기 위하여 기계 또는 설비를 세밀하게 조종하고 조절한다.',icon:'🔍'},
{type:'T',num:3,ko:'조절하다',en:'operating-controlling',desc:'작업이 진행되고 있는 기계나 설비가 목적에 알맞은 동작을 하도록 한다.',icon:'⚗️'},
{type:'T',num:4,ko:'운전하다',en:'driving-operating',desc:'기계 또는 설비를 시동, 정지하고 기능대로 움직이도록 한다.',icon:'🛒'},
{type:'T',num:5,ko:'조작하다',en:'manipulating',desc:'기계, 설비 또는 재료를 직접 가공, 조정, 이동한다.',icon:'⚙️'},
{type:'T',num:6,ko:'유지하다',en:'tending',desc:'기계 및 장비를 시동, 정지하고 기능대로 움직이는지 관찰한다.',icon:'⌛'},
{type:'T',num:7,ko:'공급하다',en:'supplying',desc:'기계나 장비 안에 재료를 넣거나 꺼내고 내리거나 정리한다.',icon:'🖥️'}
];
let deck=[], selected=[];
const board=document.getElementById('board');
function shuffleArr(a){return [...a].sort(()=>Math.random()-.5)}
function typeName(t){return t==='D'?'자료':t==='P'?'사람':'사물'}
function render(){
  board.innerHTML='';
  deck.forEach((c,i)=>{
    const chosen=selected.find(x=>x.id===c.id);
    const el=document.createElement('div');
    el.className='cardWrap'+(chosen?' selected':'');
    el.innerHTML=`${chosen?`<div class="badge">선택 ${selected.indexOf(chosen)+1}</div>`:''}
      <div class="card ${chosen?'flipped':''}">
        <div class="face back">
          <div>
            <div class="backTitle">${c.ko}</div>
            <div class="backEng">${c.en}</div>
            <div class="wave"></div>
            <div class="desc">${c.desc}</div>
          </div>
        </div>
        <div class="face front ${c.type.toLowerCase()}">
          <div class="topPanel">${typeName(c.type)}<span>${c.type==='D'?'Data':c.type==='P'?'People':'Thing'}</span></div>
          <div class="inner">
            <div class="cardName">${c.num}. ${c.ko}</div>
            <div class="icon">${c.icon}</div>
          </div>
          <div class="bottom">“${typeName(c.type)}”와 관련된 기능은 ${c.type==='D'?'만질 수 없으며 숫자, 단어, 기호, 생각, 개념, 표현을 포함한다.':c.type==='P'?'인간과 인간처럼 취급되는 동물을 다루는 것을 포함한다.':'무생물로서 물질, 재료, 기계, 공구, 설비, 작업도구 및 제품 등을 다루는 것을 포함한다.'}</div>
        </div>
      </div>`;
    el.onclick=()=>selectCard(c);
    board.appendChild(el)
  });
  updateResult()
}
function selectCard(c){document.getElementById('msg').textContent=''; if(selected.find(x=>x.id===c.id)){selected=selected.filter(x=>x.id!==c.id);render();return} if(selected.length>=8){document.getElementById('msg').textContent='8장까지만 선택할 수 있어요.';return} selected.push(c);render()}
function updateResult(){document.getElementById('count').textContent=selected.length; const groups={D:[],P:[],T:[]}; selected.forEach(c=>groups[c.type].push(c)); ['D','P','T'].forEach(t=>{document.getElementById(t.toLowerCase()+'c').textContent=groups[t].length; document.getElementById(t.toLowerCase()+'list').innerHTML=groups[t].map(c=>`<li>${c.ko}</li>`).join('')}); const order=['D','P','T'].sort((a,b)=>groups[b].length-groups[a].length || firstIndex(a)-firstIndex(b)); document.getElementById('code').textContent=selected.length?order.join(''):'-'}
function firstIndex(t){const n=selected.findIndex(c=>c.type===t); return n<0?99:n}
function init(){deck=shuffleArr(cards.map((c,idx)=>({...c,id:idx}))); selected=[];render()}
document.getElementById('shuffle').onclick=()=>{deck=shuffleArr(deck);render()};document.getElementById('reset').onclick=init;init();
</script></body></html>
