<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>나의 진로 선택 보드</title>
  <style>
    :root {
      --bg: #fff7fb;
      --card: #ffffff;
      --text: #273044;
      --muted: #6b7280;
      --primary: #ff7eb6;
      --primary-dark: #e84d8a;
      --blue: #71c7ec;
      --yellow: #ffe08a;
      --green: #96e6b3;
      --purple: #b69cff;
      --line: #f0d9e6;
      --shadow: 0 10px 25px rgba(39,48,68,.10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
      background:
        radial-gradient(circle at 20% 10%, #fff2a8 0 8%, transparent 9%),
        radial-gradient(circle at 85% 20%, #c7f9ff 0 10%, transparent 11%),
        radial-gradient(circle at 20% 85%, #ffd1e8 0 12%, transparent 13%),
        var(--bg);
      color: var(--text);
      line-height: 1.45;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255,247,251,.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
      padding: 16px 14px 12px;
    }

    .wrap {
      max-width: 1080px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(22px, 5vw, 34px);
      letter-spacing: -0.04em;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 12px;
    }

    .top-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .search {
      width: 100%;
      border: 2px solid #ffd1e8;
      border-radius: 18px;
      padding: 13px 15px;
      font-size: 16px;
      outline: none;
      background: #fff;
    }

    .search:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(255,126,182,.18);
    }

    .board-buttons {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .board-btn {
      border: 0;
      border-radius: 16px;
      padding: 11px 6px;
      font-weight: 800;
      color: #344054;
      background: #fff;
      box-shadow: 0 4px 12px rgba(39,48,68,.08);
      cursor: pointer;
      font-size: 13px;
    }

    .board-btn.active {
      background: var(--primary);
      color: #fff;
    }

    main {
      padding: 18px 14px 24px;
    }

    .status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin: 8px 0 14px;
      color: var(--muted);
      font-size: 14px;
    }

    .count-badge {
      background: #fff;
      color: var(--primary-dark);
      border: 2px solid #ffd1e8;
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 900;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    @media (min-width: 720px) {
      .top-row { grid-template-columns: 1.2fr 1fr; align-items: center; }
      .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
      .board-btn { font-size: 14px; }
    }

    @media (min-width: 980px) {
      .cards { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }

    .job-card {
      position: relative;
      background: var(--card);
      border: 2px solid transparent;
      border-radius: 24px;
      padding: 16px 14px 14px;
      box-shadow: var(--shadow);
      min-height: 220px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .job-card::before {
      content: "";
      position: absolute;
      width: 86px;
      height: 86px;
      border-radius: 50%;
      right: -25px;
      top: -28px;
      background: linear-gradient(135deg, #ffd1e8, #c7f9ff);
      opacity: .8;
    }

    .job-card.selected {
      border-color: var(--primary);
      background: #fffafc;
    }

    .job-no {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 10px;
      background: #f3f4f6;
      color: #64748b;
      font-size: 13px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .job-title {
      position: relative;
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
      letter-spacing: -0.04em;
      word-break: keep-all;
    }

    .dept {
      position: relative;
      display: inline-block;
      margin: 8px 0 8px;
      font-size: 13px;
      font-weight: 800;
      color: #8a4f00;
      background: #fff0bb;
      border-radius: 999px;
      padding: 5px 9px;
      width: fit-content;
      max-width: 100%;
      word-break: keep-all;
    }

    .desc {
      position: relative;
      color: #4b5563;
      font-size: 13.5px;
      margin: 0 0 12px;
      word-break: keep-all;
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .select-btn {
      margin-top: auto;
      border: 0;
      border-radius: 15px;
      padding: 11px 10px;
      font-weight: 900;
      font-size: 14px;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, var(--primary), #ff9f7e);
      box-shadow: 0 8px 16px rgba(255,126,182,.25);
    }

    .select-btn.selected {
      background: #9ca3af;
      box-shadow: none;
    }

    .empty {
      grid-column: 1 / -1;
      background: #fff;
      border-radius: 20px;
      padding: 30px 20px;
      text-align: center;
      color: var(--muted);
      box-shadow: var(--shadow);
    }

    .selected-panel {
      position: static;
      z-index: 1;
      background: rgba(255,255,255,.96);
      border-top: 1px solid var(--line);
      box-shadow: 0 -6px 18px rgba(39,48,68,.06);
      margin-top: 10px;
    }

    .selected-inner {
      max-width: 1080px;
      margin: 0 auto;
      padding: 12px 14px 16px;
    }

    .selected-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .selected-title {
      font-weight: 900;
      font-size: 16px;
    }

    .clear-btn {
      border: 0;
      background: #f3f4f6;
      border-radius: 999px;
      padding: 8px 10px;
      font-weight: 800;
      color: #64748b;
      cursor: pointer;
    }

    .table-scroll {
      overflow-x: auto;
      border-radius: 14px;
      border: 1px solid #eef0f4;
      background: #fff;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 760px;
      font-size: 13px;
    }

    th, td {
      border-bottom: 1px solid #eef0f4;
      padding: 9px 8px;
      text-align: center;
      white-space: nowrap;
    }

    th {
      background: #fdf2f8;
      color: #9d174d;
      font-weight: 900;
    }

    td:nth-child(2), th:nth-child(2) {
      text-align: left;
      font-weight: 800;
    }

    .remove-row {
      border: 0;
      background: #fee2e2;
      color: #b91c1c;
      border-radius: 999px;
      padding: 5px 8px;
      font-weight: 900;
      cursor: pointer;
    }

    .hint {
      color: var(--muted);
      font-size: 12px;
      margin-top: 7px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 52vh;
      transform: translateX(-50%);
      background: #273044;
      color: white;
      padding: 10px 14px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
      opacity: 0;
      pointer-events: none;
      transition: .2s;
      z-index: 40;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>

      <section class="cards" id="cards"></section>

  </main>

  <section class="selected-panel">

      <div class="table-scroll">

              <th>숙련기간</th>
              <th>학과</th>

          <tbody id="selectedBody">
            <tr><td colspan="9">아직 선택한 직업이 없어요.</td></tr>
          </tbody>
        </table>
      </div>
      <div class="hint">교재에는 이 표를 보고 직업명, 유형, 직업기능, 숙련기간, 학과를 옮겨 적으면 됩니다.</div>
    </div>
  </section>

    let currentBoard = 1;
    let selected = [];

    const cardsEl = document.getElementById('cards');
    const selectedBody = document.getElementById('selectedBody');
    const selectedCount = document.getElementById('selectedCount');
    const searchInput = document.getElementById('searchInput');
    const boardLabel = document.getElementById('boardLabel');
    const toast = document.getElementById('toast');

    function boardRange(board) {
      const start = (board - 1) * 24 + 1;
      const end = board * 24;
      return [start, end];
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1500);
    }

    function renderCards() {
      const [start, end] = boardRange(currentBoard);
      const query = searchInput.value.trim().toLowerCase();

      boardLabel.textContent = query
        ? `검색 결과 · 보드 ${currentBoard}`
        : `보드 ${currentBoard} · ${start}~${end}번`;

      const list = jobs.filter(job => {
        const inBoard = job["번호"] >= start && job["번호"] <= end;
        const text = `${job["직업명"]} ${job["학과"]} ${job["설명"]}`.toLowerCase();
        return inBoard && (!query || text.includes(query));
      });

      if (list.length === 0) {
        cardsEl.innerHTML = '<div class="empty">검색 결과가 없어요. 다른 단어로 검색해 보세요.</div>';
        return;
      }

      cardsEl.innerHTML = list.map(job => {
        const isSelected = selected.some(item => item["번호"] === job["번호"]);
        const dept = job["학과"] || "관련 학과 정보 없음";
        return `
          <article class="job-card ${isSelected ? 'selected' : ''}">
            <span class="job-no">${job["번호"]}</span>
            <h2 class="job-title">${escapeHtml(job["직업명"])}</h2>
            <span class="dept">관련학과 · ${escapeHtml(dept)}</span>
            <p class="desc">${escapeHtml(job["설명"] || "직업 설명을 준비 중입니다.")}</p>
            <button class="select-btn ${isSelected ? 'selected' : ''}" onclick="toggleSelect(${job["번호"]})">
              ${isSelected ? '선택 취소' : '선택하기'}
            </button>
          </article>
        `;
      }).join('');
    }

    function toggleSelect(no) {
      const index = selected.findIndex(item => item["번호"] === no);
      if (index >= 0) {
        selected.splice(index, 1);
      } else {
        if (selected.length >= 10) {
          showToast('최대 10개까지 선택할 수 있어요.');
          return;
        }
        const job = jobs.find(item => item["번호"] === no);
        selected.push(job);
      }
      renderCards();
      renderSelected();
    }

    function renderSelected() {
      selectedCount.textContent = selected.length;

      if (selected.length === 0) {
        selectedBody.innerHTML = '<tr><td colspan="9">아직 선택한 직업이 없어요.</td></tr>';
        return;
      }

      selectedBody.innerHTML = selected.map((job, idx) => `
        <tr>
          <td>${idx + 1}</td>
          <td>${escapeHtml(job["직업명"])}</td>
          <td>${escapeHtml(job["유형"] || '-')}</td>
          <td>${escapeHtml(job["자료"] || '-')}</td>
          <td>${escapeHtml(job["사람"] || '-')}</td>
          <td>${escapeHtml(job["사물"] || '-')}</td>
          <td>${escapeHtml(job["숙련기간"] || '-')}</td>
          <td>${escapeHtml(job["학과"] || '-')}</td>
          <td><button class="remove-row" onclick="toggleSelect(${job["번호"]})">삭제</button></td>
        </tr>
      `).join('');
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    document.getElementById('boardButtons').addEventListener('click', (e) => {
      if (!e.target.matches('.board-btn')) return;
      currentBoard = Number(e.target.dataset.board);
      document.querySelectorAll('.board-btn').forEach(btn => btn.classList.remove('active'));
      e.target.classList.add('active');
      renderCards();
    });

    searchInput.addEventListener('input', renderCards);

    document.getElementById('clearBtn').addEventListener('click', () => {
      selected = [];
      renderCards();
      renderSelected();
    });

    renderCards();
    renderSelected();
  </script>
