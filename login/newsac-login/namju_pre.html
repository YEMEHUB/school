<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>남주중학교 1학년 4반 | 사전 설문조사</title><style>
:root{--blue:#2563eb;--ink:#142235;--muted:#64748b;--line:#e3eaf3;--pale:#e8f1ff}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Pretendard,"Noto Sans KR","Malgun Gothic",sans-serif;background:linear-gradient(130deg,#eaf2ff,#f6f9fd 55%,#edf7ff)}
.wrap{max-width:1540px;margin:0 auto;padding:28px 26px 70px}.hero{background:white;border:1px solid var(--line);border-radius:30px;padding:40px;box-shadow:0 14px 45px rgba(31,65,112,.09)}
.tag{display:inline-block;background:#dbeafe;color:#1d4ed8;border-radius:30px;padding:9px 16px;font-size:14px;font-weight:900}h1{font-size:clamp(30px,3.5vw,53px);letter-spacing:-.05em;margin:21px 0 14px;line-height:1.22}.intro{font-size:17px;color:#53667d;line-height:1.7;margin:0}.intro strong{color:#1e40af}
.info{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px 16px;max-width:1020px;margin-top:52px;padding-top:29px;border-top:1px solid var(--line)}.item{border:1px solid var(--line);border-radius:17px;background:#f8fafc;display:flex;align-items:center;gap:17px;padding:16px 20px;min-height:64px}.item span{color:#668099;font-size:13px;font-weight:800;flex:0 0 112px}.item strong{font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:30px 2px 18px;flex-wrap:wrap}.bar strong{font-size:17px}.bar input{width:min(460px,100%);font-size:16px;border:1px solid #d9e3ef;background:white;padding:16px 20px;border-radius:16px;outline:none}.bar input:focus{border-color:#60a5fa;box-shadow:0 0 0 4px #60a5fa22}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}.card{min-width:0;background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px 20px;box-shadow:0 7px 22px #122a450a}.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:22px}.number{background:#dfedff;color:#2563eb;padding:12px 15px;border-radius:14px;font-weight:900}.name{font-size:21px;font-weight:900}.lbl{font-size:13px;color:#73869d;font-weight:850;margin-bottom:10px}.code-row{display:flex;gap:8px;min-width:0}.code{min-width:0;flex:1;background:#f1f5f9;border:1px solid #e1e8f0;border-radius:14px;padding:13px 8px;text-align:center;font-size:clamp(16px,1.7vw,23px);font-weight:900;letter-spacing:.045em;font-variant-numeric:tabular-nums}.copy{background:#0f172a;color:white;border:0;border-radius:13px;padding:0 17px;font-size:15px;font-weight:900;cursor:pointer}.copy:hover{background:#334155}.survey{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:15px}.survey a{display:flex;align-items:center;justify-content:center;min-height:48px;text-align:center;padding:10px 5px;text-decoration:none;font-size:14px;font-weight:900;border:1px solid;border-radius:13px;white-space:normal}.survey a:first-child{color:#1d4ed8;background:#eef5ff;border-color:#d7e8ff}.survey a:last-child{color:#047857;background:#e9fbf2;border-color:#c6f3dd}.survey a:hover{filter:brightness(.965)}.empty{display:none;padding:45px;text-align:center;color:var(--muted)}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#111827;color:white;padding:13px 21px;border-radius:25px;font-weight:800;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.wrap{padding:22px}}@media(max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:28px}.info{margin-top:30px}}@media(max-width:550px){.wrap{padding:14px 12px 40px}.hero{padding:22px;border-radius:23px}.info{grid-template-columns:1fr;margin-top:22px;padding-top:20px}.item{padding:12px}.item span{flex-basis:95px}.grid{grid-template-columns:1fr}.bar input{width:100%}.card{padding:20px}}
</style></head><body>
 <div class="wrap"><header class="hero"><span class="tag">남주중학교 1학년 4반</span><h1>2026년 디지털새싹 사전설문조사</h1><p class="intro">자신의 이름을 찾아 학생코드를 복사하세요. <strong>① 핵심역량 진단과 ② 효과성 측정을 순서대로 모두 진행</strong>해야 설문이 완료됩니다.<br>첫 번째 설문을 제출한 후 이 화면으로 돌아와 두 번째 설문을 진행하세요.</p><div class="info"><div class="item"><span>유형</span><strong>방문형</strong></div><div class="item"><span>프로그램명</span><strong>AI로 만드는 나만의 식단 설계 앱 스튜디오</strong></div><div class="item"><span>운영기관명</span><strong>에프엔제이</strong></div><div class="item"><span>살고 있는 지역</span><strong>도서지역</strong></div></div></header>
 <section class="bar"><strong>총 <span id="count">26</span>명</strong><input id="search" type="search" placeholder="번호 또는 이름 검색" aria-label="번호 또는 이름 검색" autocomplete="off"></section><main id="grid" class="grid"></main><div id="empty" class="empty">검색 결과가 없습니다.</div></div><div id="toast" class="toast" role="status" aria-live="polite">학생코드를 복사했습니다.</div>
 <script>const students=[{"number": 1, "name": "강*빈", "code": "118921"}, {"number": 2, "name": "강*성", "code": "521734"}, {"number": 3, "name": "강*민", "code": "239538"}, {"number": 4, "name": "고*빈", "code": "798246"}, {"number": 5, "name": "고*협", "code": "594174"}, {"number": 6, "name": "고*수", "code": "919402"}, {"number": 7, "name": "김*리", "code": "331911"}, {"number": 8, "name": "김*언", "code": "891200"}, {"number": 9, "name": "김*준", "code": "334481"}, {"number": 10, "name": "김*범", "code": "283738"}, {"number": 11, "name": "김*후", "code": "514794"}, {"number": 12, "name": "김*성", "code": "637342"}, {"number": 13, "name": "박*수", "code": "593358"}, {"number": 14, "name": "송*근", "code": "20034"}, {"number": 15, "name": "신*", "code": "358738"}, {"number": 16, "name": "양*온", "code": "638300"}, {"number": 17, "name": "오*준", "code": "850103"}, {"number": 18, "name": "오*웅", "code": "849527"}, {"number": 19, "name": "윤*우", "code": "142790"}, {"number": 20, "name": "윤*성", "code": "773445"}, {"number": 21, "name": "이*온", "code": "83222"}, {"number": 22, "name": "이*서", "code": "520157"}, {"number": 23, "name": "정*수", "code": "450327"}, {"number": 24, "name": "정*준", "code": "485199"}, {"number": 25, "name": "진*성", "code": "714422"}, {"number": 26, "name": "현*준", "code": "516988"}];const urls=["https://form.kosac.re.kr/v/SUgTnY61ukfLc6yERbqg", "https://form.kosac.re.kr/v/ItXeheqZl2ZyLuRUTRtI"];const grid=document.getElementById('grid'),search=document.getElementById('search'),count=document.getElementById('count'),empty=document.getElementById('empty'),toast=document.getElementById('toast');
 function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
 function render(){let q=search.value.trim().toLowerCase(),filtered=students.filter(s=>String(s.number).includes(q)||s.name.toLowerCase().includes(q));count.textContent=filtered.length;empty.style.display=filtered.length?'none':'block';grid.innerHTML=filtered.map(s=>`<article class="card"><div class="head"><span class="number">${s.number}</span><span class="name">${esc(s.name)}</span></div><div class="lbl">학생코드</div><div class="code-row"><div class="code">${esc(s.code)}</div><button class="copy" type="button" data-code="${esc(s.code)}" aria-label="${esc(s.name)} 학생코드 복사">복사</button></div><div class="survey"><a href="${urls[0]}" target="_blank" rel="noopener noreferrer" aria-label="1단계 핵심역량 진단 사전 설문 열기">① 핵심역량 진단</a><a href="${urls[1]}" target="_blank" rel="noopener noreferrer" aria-label="2단계 효과성 측정 사전 설문 열기">② 효과성 측정</a></div></article>`).join('');}
 async function copyCode(code){let ok=false;try{await navigator.clipboard.writeText(code);ok=true;}catch(e){let t=document.createElement('textarea');t.value=code;document.body.appendChild(t);t.select();ok=document.execCommand('copy');t.remove();}toast.textContent=ok?'학생코드를 복사했습니다.':'복사에 실패했습니다. 코드를 직접 선택해 주세요.';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1500);}
 grid.addEventListener('click',e=>{let button=e.target.closest('button[data-code]');if(button)copyCode(button.dataset.code);});search.addEventListener('input',render);render();</script></body></html>
