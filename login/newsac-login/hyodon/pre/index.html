
<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>나의 AI 영상 제작 작업실 · 효돈중학교</title><style>
:root{--g:#176b54;--gd:#104938;--p:#faf9f3;--cream:#fffefa;--line:#d8ded3;--yellow:#efd46b;--muted:#69796e;--ink:#233b32}*{box-sizing:border-box}body{margin:0;background:var(--p);font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:var(--ink);line-height:1.7}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:white;border-radius:9px;padding:10px 14px;color:var(--ink);font-weight:700}button:hover{background:#eaf0e9}button.primary,.active{background:var(--g)!important;border-color:var(--g)!important;color:white!important}button.yellow{background:var(--yellow);border-color:var(--yellow)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #e6bf37}a{color:var(--g);font-weight:700}.top{height:76px;background:var(--cream);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px 26px;gap:12px;position:sticky;top:0;z-index:5}.logo{font-weight:900;font-size:17px}.logo span{background:var(--g);color:var(--yellow);padding:9px 13px;border-radius:10px;margin-right:10px}.top-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.top-actions button{font-size:12px;padding:8px}.saved{font-size:12px;color:var(--muted)}.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 76px)}aside{background:#f0f2e9;border-right:1px solid var(--line);padding:25px 17px;position:sticky;top:76px;height:calc(100vh - 76px);overflow:auto}.sidehead{font-size:13px;font-weight:800;margin:10px 6px}.group{margin-bottom:22px}.sidebutton{width:100%;border:none;background:transparent;text-align:left;font-size:13px;padding:9px 10px;font-weight:500;color:#637367;display:flex;gap:9px}.sidebutton .num{font-size:11px;min-width:22px}.sidebutton.done .num{color:var(--g);font-weight:900}.main{max-width:1080px;width:100%;padding:35px 45px 65px;margin:auto;align-self:start}.kicker{font-size:12px;font-weight:900;color:var(--g);letter-spacing:1px}.hero{display:grid;grid-template-columns:1.2fr 1fr;align-items:center;gap:35px;padding:25px 0 40px}.hero h1{font-size:46px;letter-spacing:-2px;line-height:1.3;margin:12px 0 20px}.hero h1 em{color:var(--g);font-style:normal}.sub{font-size:17px;color:var(--muted)}.poster{padding:24px;background:#eee8d2;border:1px solid #d9d0b3;box-shadow:11px 11px #dce7d8;transform:rotate(1deg)}.frames{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.frame{background:white;min-height:115px;display:grid;place-items:center;text-align:center;border:2px solid #254536;padding:12px;font-weight:800}.frame:nth-child(2){background:#e2ebdc}.frame:nth-child(3){background:#f8e7ae}.frame:nth-child(4){background:#e5ede7}.road{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.road>div,.card{background:var(--cream);border:1px solid var(--line);padding:20px;border-radius:12px}.road b{display:block;font-size:25px;color:var(--g)}h1{font-size:34px;letter-spacing:-1px;line-height:1.3;margin:10px 0}h2{font-size:20px;margin:0 0 16px}h3{font-size:16px;margin:0 0 10px}.panel{background:var(--cream);border:1px solid var(--line);padding:24px;border-radius:12px;margin:18px 0}.note{background:#f5f0df;border-left:4px solid var(--yellow);padding:14px 17px;border-radius:0 8px 8px 0;margin:15px 0;font-size:14px}.note.green{border-color:var(--g);background:#e8f0e7}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{margin:15px 0}.field label{font-size:14px;font-weight:800;display:block;margin-bottom:6px}.field small{display:block;font-size:12px;color:var(--muted)}input[type=text],textarea,select,input[type=number],input[type=url]{width:100%;padding:12px;border:1px solid #cbd4c7;border-radius:8px;background:white;color:var(--ink)}textarea{min-height:92px;resize:vertical}.prompt{white-space:pre-wrap;overflow-wrap:anywhere;background:#e9f1e9;border:1px solid #cddfcb;border-radius:10px;padding:18px;font-size:14px;max-height:440px;overflow:auto}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.stepfoot{display:flex;justify-content:space-between;margin-top:35px;padding-top:22px;border-top:1px solid var(--line)}.tag{display:inline-block;background:#e2eee2;color:var(--g);padding:4px 11px;border-radius:5px;font-size:12px;font-weight:800}.tag.gold{background:#f6e8ad;color:#635019}.check{display:block;margin:12px 0;font-size:14px}.check input{width:17px;height:17px;accent-color:var(--g);vertical-align:middle;margin-right:8px}.scene-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.scene-card{border:1px solid var(--line);border-radius:10px;background:#f9faf6;padding:15px}.preview{width:100%;max-height:310px;object-fit:contain;background:#edf1e9;margin:10px 0;border-radius:9px}.upload{display:block;border:2px dashed #b9cdb9;border-radius:10px;padding:18px;background:#f3f7ee;margin-top:10px;text-align:center}.upload input{max-width:100%;font-size:13px}.status{color:var(--muted);font-size:13px}.bottom{border-top:1px solid var(--line);margin-top:30px;padding-top:16px;color:var(--muted);font-size:12px}.hidden{display:none}.bar{background:#d9e1d5;height:6px;border-radius:10px;overflow:hidden;margin:10px 5px}.bar div{height:100%;background:var(--g)}@media(max-width:900px){.shell{grid-template-columns:200px 1fr}.main{padding:25px}.road{grid-template-columns:1fr 1fr}.hero{grid-template-columns:1fr}.poster{max-width:450px}}@media(max-width:650px){.shell{display:block}aside{position:static;height:auto;display:none}.show-menu aside{display:block}.top{height:auto;flex-wrap:wrap}.main{padding:20px}.hero h1{font-size:35px}.grid2,.scene-grid{grid-template-columns:1fr}.road{grid-template-columns:1fr 1fr}.stepfoot{gap:10px}.saved{display:none}}@media print{.top,aside,.stepfoot,button,.bottom,.upload{display:none!important}.shell{display:block}.main{max-width:none;padding:0}.panel{break-inside:avoid}}
</style></head><body><header class="top"><div class="logo"><span>▶</span>나의 AI 영상 제작 작업실 <small style="display:block;color:#859187;font-size:11px;margin-left:55px">HYODON · K-CREATOR</small></div><div class="top-actions"><span class="saved" id="saved">작업 준비</span><button id="menuBtn">☰ 목차</button><button id="summaryBtn">내 작업 정리</button><button id="backupBtn">작업 백업 ↓</button><button id="importBtn">불러오기</button></div></header><div class="shell" id="shell"><aside id="side"></aside><main class="main" id="main"></main></div><input id="importFile" type="file" accept=".json" hidden><script>
'use strict';const KEY='hyodon_kcreator_video_v1';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const titles=[['start','영상 제작 안내'],['planning','주제·목표·전달 대상'],['prompt','초정밀 프롬프트 설계'],['analysis','AI 결과 분석·디버깅'],['story','최종 대본과 스토리보드'],['character','캐릭터·영상 스타일'],['assets','장면별 이미지 제작'],['clips','Grok AI 장면별 영상 제작'],['edit','편집·내레이션·자막'],['test','상영 전 점검·수정'],['publish','최종 영상 완성·제출'],['reflect','창작 성찰·공유']];
const groups=[{name:'4차시 · 기획과 영상 설계',ids:titles.slice(0,6).map(x=>x[0])},{name:'5차시 · 제작과 완성',ids:titles.slice(6).map(x=>x[0])}];
const fresh=()=>({current:'home',done:[],fields:{},checks:{},scenes:Array.from({length:6},(_,i)=>({no:i+1,scene:'',camera:'',line:'',sound:'',duration:'5',prompt:'',image:'',video:'',review:''})),files:{},project:'나의 첫 AI 영상'});let data=fresh(), urls={};try{let old=JSON.parse(localStorage.getItem(KEY));if(old&&Array.isArray(old.scenes))data={...fresh(),...old}}catch(e){}
function F(k){return data.fields[k]??''}function store(){try{localStorage.setItem(KEY,JSON.stringify(data));$('#saved').textContent='✓ 이 기기에 저장됨'}catch(e){$('#saved').textContent='저장 실패 · 백업하세요'}}function field(k,label,placeholder='',multi=false){return `<div class="field"><label for="f-${k}">${esc(label)}</label>${multi?`<textarea id="f-${k}" data-field="${k}" placeholder="${esc(placeholder)}">${esc(F(k))}</textarea>`:`<input id="f-${k}" data-field="${k}" type="text" value="${esc(F(k))}" placeholder="${esc(placeholder)}">`}</div>`}function check(k,label){return `<label class="check"><input type="checkbox" data-check="${k}" ${data.checks[k]?'checked':''}>${esc(label)}</label>`}function note(s,green=false){return `<div class="note ${green?'green':''}">${s}</div>`}function prompt(id,s){return `<div class="panel"><div class="row between"><strong>AI에게 전달할 요청 문구</strong><button class="yellow" data-copy="${id}">복사하기</button></div><pre class="prompt" id="prompt-${id}">${esc(s)}</pre><div class="row"><a href="https://gemini.google.com/" target="_blank" rel="noopener">Gemini 열기 ↗</a><a href="https://grok.com/" target="_blank" rel="noopener">Grok 열기 ↗</a></div><p class="status">이 작업실은 요청 문구를 준비합니다. AI 생성은 각 서비스에서 직접 실행하며 계정 및 이용 가능 기능을 확인하세요.</p></div>`}function sfield(i,k,label,ph='',multi=true){let v=data.scenes[i][k]??'';return `<div class="field"><label>${esc(label)}</label>${multi?`<textarea data-scene="${i}" data-prop="${k}" placeholder="${esc(ph)}">${esc(v)}</textarea>`:`<input type="text" data-scene="${i}" data-prop="${k}" value="${esc(v)}" placeholder="${esc(ph)}">`}</div>`}function upload(key,title,accept='image/*,video/*'){let name=data.files[key]||'';return `<div class="panel"><strong>${esc(title)}</strong><label class="upload">파일 선택 (이 기기에서 미리보기)<input type="file" data-upload="${key}" accept="${accept}"></label><p class="status">${name?'등록한 파일명: '+esc(name):'아직 선택한 파일이 없습니다.'} · 영상·이미지 원본은 기기에 따로 보관하세요.</p><div id="preview-${key}"></div></div>`}function sceneSummary(s,i){return `[장면 ${i+1}]\n장면: ${s.scene}\n화면·카메라: ${s.camera}\n대사/내레이션: ${s.line}\n소리/효과: ${s.sound}\n길이: ${s.duration}초`};function fullStory(){return data.scenes.map(sceneSummary).join('\n\n')};
function renderSide(){let count=data.done.length;$('#side').innerHTML=`<div class="sidehead">나의 영상 제작 여정 <span style="float:right">${count}/${titles.length}</span></div><div class="bar"><div style="width:${count/titles.length*100}%"></div></div><button class="sidebutton ${data.current==='home'?'active':''}" data-go="home">⌂ 처음으로</button>`+groups.map(g=>`<div class="group"><div class="sidehead">${esc(g.name)}</div>${g.ids.map(id=>{let i=titles.findIndex(t=>t[0]===id);return `<button class="sidebutton ${data.current===id?'active':''} ${data.done.includes(id)?'done':''}" data-go="${id}"><span class="num">${data.done.includes(id)?'✓':String(i+1).padStart(2,'0')}</span>${esc(titles[i][1])}</button>`}).join('')}</div>`).join('')}
function home(){return `<div class="hero"><div><div class="kicker">YOUR STORY, YOUR VIDEO</div><h1>내 생각을<br><em>하나의 영상으로.</em></h1><p class="sub">AI가 만든 결과를 그대로 끝내지 않고, 내가 기획하고 확인하고 수정해서 완성하는 영상 제작 프로젝트.</p><button class="primary" data-go="${data.done.length?titles.find(x=>!data.done.includes(x[0]))?.[0]||'publish':'start'}">${data.done.length?'이어서 제작하기':'영상 만들기 시작'} →</button></div><div class="poster"><strong>MY AI VIDEO · 6 SCENES</strong><div class="frames"><div class="frame">01<br>기획</div><div class="frame">02<br>프롬프트</div><div class="frame">03<br>영상 생성</div><div class="frame">04<br>디버깅·완성</div></div></div></div><h2>5차시 운영을 위한 제작 로드맵</h2><div class="road"><div><b>01</b>주제·메시지 결정</div><div><b>02</b>프롬프트·스토리보드</div><div><b>03</b>영상 생성·편집</div><div><b>04</b>점검·수정·공유</div></div>${note('교안 1~3차시의 AI 체험, 윤리, 주제 발굴과 설문 활동을 이미 마쳤다는 전제로 시작합니다. 교안의 5차시 ‘초정밀 프롬프트 설계·결과 디버깅·스토리보드’와 6차시 ‘스토리북·Grok AI’ 실습을 영상 제작 과정에 연결했습니다.',true)}${note('이 HTML은 영상 생성·편집 프로그램 자체가 아니라, 학생의 순서 안내와 작업 기록을 위한 작업실입니다. 실제 영상은 Grok 등 사용 가능한 외부 도구에서 제작하고 파일로 보관합니다.')}<p class="status">입력한 글은 현재 브라우저에 자동 저장됩니다. 다른 기기에서 이어하려면 상단의 ‘작업 백업’을 이용하세요.</p>`}
function page(id){switch(id){
case'start':return `<div class="grid2"><div class="card"><h3>교안에서 이어오는 활동</h3><p>초정밀 프롬프트 설계 → AI 결과 분석 및 디버깅 → 최종 대본 및 스토리보드 생성 → Grok AI 디자인/영상 제작.</p></div><div class="card"><h3>최종 결과물</h3><p>6개 장면을 중심으로 만든 짧은 AI 영상 1개와 기획·수정 기록. 6장면은 수업을 위한 권장 틀이며 필요하면 조절할 수 있어요.</p></div></div>${note('실제 교안은 8차시 구성입니다. 이 작업실은 이미 진행한 1~3차시 이후의 영상 제작 활동을 4~5차시 수업에 맞춰 재구성한 것입니다.')}${field('student','이름 또는 활동명','개인정보를 최소한으로 적으세요.')}${field('project','영상 작품 제목','예: 플라스틱 한 병의 여행')}${check('started','내가 직접 주제를 결정하고 AI 결과를 확인하며 제작하겠습니다.')}`;
case'planning':return `${field('topic','확정한 주제','앞서 정한 주제')}${field('survey','설문 또는 자료에서 발견한 점','이전 차시에 분석한 결과를 요약해요.',true)}${field('audience','영상을 볼 대상','예: 같은 학교 중학생')}${field('message','전달할 핵심 메시지','이 영상을 본 사람이 기억할 한 문장',true)}${field('genre','영상 형식','예: 애니메이션 / 뉴스 / 광고 / 짧은 드라마')}${field('length','목표 영상 길이','예: 약 30~45초')}${note('설문 결과를 사용한다면 실제로 확인한 사실만 적으세요. 숫자나 의견을 임의로 만들지 않습니다.')}`;
case'prompt':{let t=`너는 중학생 대상 짧은 영상의 기획자이자 스토리보드 작가야.\n[페르소나(Persona)] 이해하기 쉬운 영상 기획을 돕는 작가\n[상황(Context)] 주제: ${F('topic')}; 시청 대상: ${F('audience')}; 설문에서 발견한 점: ${F('survey')}\n[임무(Task)] 핵심 메시지 '${F('message')}'를 전달하는 ${F('genre')||'짧은 영상'}의 6장면 이야기 구조를 설계해 줘.\n[출력 형식(Format)] 제목, 한 줄 메시지, 1~6장면의 '화면/행동, 카메라, 내레이션·대사, 소리, 권장 초'를 표로 작성해 줘.\n[조건] 시작-문제-전개-전환-해결-마무리가 자연스럽게 연결되도록 구성해 줘. 한 장면에는 하나의 핵심 행동만 넣고, 확인하지 못한 사실은 '확인 필요'라고 표시해 줘. 사실처럼 지어내지 마.`;return `<div class="grid2"><div class="card"><h3>교안의 4가지 구성 요소</h3><p><b>페르소나</b> : AI의 역할<br><b>상황</b> : 목적과 배경<br><b>임무</b> : 해야 할 작업<br><b>출력 형식</b> : 결과의 모양</p></div><div class="card"><h3>일반 요청 vs 초정밀 요청</h3><p>일반: “환경 보호 영상 만들어 줘.”<br>초정밀: 누구에게, 어떤 메시지를, 몇 장면과 어떤 형식으로 만들지 구체적으로 요청해요.</p></div></div>${prompt('p1',t)}${field('aiDraft','AI가 제안한 기획 내용 붙여넣기','결과를 복사해 두면 다음 단계에서 비교할 수 있어요.',true)}`}
case'analysis':return `${note('교안의 AI 결과 디버깅 4단계: ① 오류 원인 파악 → ② 재확인 및 비교 → ③ 프롬프트 수정 → ④ 최적 소스 확보.',true)}${['장면 간 앞뒤 논리가 자연스러운가요?','내용이 핵심 메시지와 맞나요?','사실 확인이 필요한 부분이 있나요?','인물·배경·소품의 모순은 없나요?'].map((x,i)=>check('a'+i,x)).join('')}${field('issues','1. 발견한 오류·아쉬운 점','예: 주인공 가방 색이 바뀜 / 결말이 갑자기 끝남',true)}${field('compare','2. 다시 확인하거나 비교한 내용','어떤 기준이나 자료와 비교했나요?',true)}${field('fix','3. 수정 지시','무엇을 어떻게 바꿀지 구체적으로 적으세요.',true)}${prompt('debug',`아래 영상 기획 초안의 흐름과 핵심 메시지는 유지하되, 지적한 부분만 수정해 줘.\n주제: ${F('topic')}\n핵심 메시지: ${F('message')}\n확인한 문제: ${F('issues')}\n비교·확인 내용: ${F('compare')}\n수정 요청: ${F('fix')}\n수정 사항과 수정 이유를 먼저 설명하고, 그다음 최종 6장면 스토리보드를 보여 줘.\n\n원래 초안:\n${F('aiDraft')}`)}${field('finalDraft','4. 확정한 수정 결과','AI의 수정안을 확인한 후 필요한 부분을 직접 정리해요.',true)}`;
case'story':return `${note('교안의 ‘최종 대본 및 스토리보드 생성’ 단계입니다. Gemini Storybook 등의 아이디어를 활용할 수 있지만, 실제 영상 제작에 사용할 장면 설명은 아래에 학생이 직접 확정합니다.')}<div class="scene-grid">${data.scenes.map((s,i)=>`<div class="scene-card"><h3><span class="tag">SCENE ${i+1}</span> ${['시작','문제','전개','전환','해결','마무리'][i]}</h3>${sfield(i,'scene','화면에 보이는 장면','장소·인물·행동')}${sfield(i,'camera','화면 구성·카메라','예: 가까이 잡기, 고정 화면')}${sfield(i,'line','대사 / 내레이션','한 장면에 한두 문장')}${sfield(i,'sound','음악 / 효과음','예: 발소리, 잔잔한 배경음악',false)}${sfield(i,'duration','예상 길이(초)','예: 5',false)}</div>`).join('')}</div>${check('storyReady','시작부터 마무리까지 이야기가 연결되고 6장면을 확인했어요.')}`;
case'character':return `${field('character','인물의 외모·복장·특징','예: 검은 단발, 초록 후드티, 노란 배낭',true)}${field('style','전체 그림·영상 스타일','예: 따뜻한 3D 애니메이션, 부드러운 자연광')}${field('ratio','화면 비율','예: 세로 9:16 / 가로 16:9')}${field('negative','영상에 넣지 않을 것','예: 추가 인물, 자막, 워터마크, 무서운 분위기')}${prompt('style',`아래 설정을 바탕으로 모든 장면에서 일관되게 사용할 캐릭터 기준 이미지를 만들어 줘.\n인물: ${F('character')}\n스타일: ${F('style')}\n영상 비율: ${F('ratio')}\n제외 요소: ${F('negative')}\n전신이 보이고 얼굴, 옷, 색상, 소품이 분명하게 드러나도록 만들어 줘. 배경은 단순하게, 글자 없이 표현해 줘.`)}${upload('character','캐릭터 기준 이미지','image/*')}${check('characterReady','다음 장면에서도 같은 캐릭터를 유지할 기준을 정했어요.')}`;
case'assets':return `${note('각 장면 이미지에 동일한 캐릭터 기준 이미지와 공통 스타일을 반복해서 사용하세요. AI가 만들어도 옷·얼굴·물건이 달라질 수 있으므로 반드시 확인합니다.',true)}${data.scenes.map((s,i)=>`<div class="panel"><h3>장면 ${i+1} · 이미지 준비</h3><p>${esc(s.scene||'스토리보드에서 장면 설명을 먼저 입력하세요.')}</p>${prompt('img'+i,`첨부한 캐릭터 기준 이미지를 참고하여 영상의 장면 ${i+1}에 사용할 시작 프레임 이미지 한 장을 만들어 줘.\n캐릭터: ${F('character')}\n시각 스타일: ${F('style')}\n화면 비율: ${F('ratio')}\n장면: ${s.scene}\n화면 구성: ${s.camera}\n제외: ${F('negative')}\n이전 장면과 캐릭터의 얼굴·옷·색상을 같게 해 줘. 글자나 말풍선은 넣지 마.`)}${upload('img'+i,`장면 ${i+1} 이미지`,`image/*`)}</div>`).join('')}`;
case'clips':return `${note('교안은 Grok AI를 활용한 스토리북·영상 제작을 소개합니다. 실제 제공되는 영상 생성 기능, 사용 한도 및 접근 가능 여부는 계정과 서비스 환경에 따라 다를 수 있어요. 사용 가능한 영상 도구에서 장면별로 생성하세요.')}<div class="row"><a href="https://grok.com/" target="_blank" rel="noopener">Grok AI 열기 ↗</a><a href="https://gemini.google.com/" target="_blank" rel="noopener">Gemini 열기 ↗</a></div>${data.scenes.map((s,i)=>`<div class="panel"><h3>장면 ${i+1} · 영상 클립 제작</h3>${prompt('clip'+i,`첨부한 장면 ${i+1}의 시작 이미지를 바탕으로 짧은 영상 클립을 생성해 줘.\n장면의 주요 행동: ${s.scene}\n카메라 움직임: ${s.camera}\n스타일: ${F('style')}\n인물과 소품의 특징: ${F('character')}\n길이 목표: ${s.duration||'5'}초\n움직임은 자연스럽고 한 장면의 핵심 행동에 집중해 줘. 갑자기 다른 인물이나 물체를 추가하지 말고 화면 안의 글자·자막은 만들지 마.`)}${upload('video'+i,`장면 ${i+1} 영상 클립`,`video/*`)}${sfield(i,'review','클립 확인·수정 메모','움직임, 등장인물, 화면 품질 확인')}</div>`).join('')}`;
case'edit':return `${note('영상 클립이 만들어져도 자동으로 하나의 영상으로 합쳐지는 것은 아닙니다. 수업에서 사용할 수 있는 영상 편집기로 클립을 순서대로 배치하고 음성과 자막을 추가하세요.')}<div class="grid2"><div class="card"><h3>편집 순서</h3><ol><li>장면 1~6 순서대로 배치</li><li>길이 조절 및 불필요한 부분 자르기</li><li>내레이션 또는 대사 녹음</li><li>자막·효과음·배경음악 추가</li><li>처음부터 끝까지 재생</li></ol></div><div class="card"><h3>저작권·안전 확인</h3><p>음악·사진·폰트는 사용 조건을 확인하고, 친구의 얼굴이나 목소리를 무단으로 이용하지 않아요. AI 결과물의 사실 여부와 편견도 확인하세요.</p></div></div>${field('editor','사용한 편집 도구','예: 학교에서 안내한 편집 앱')}${field('narration','최종 내레이션 원고','영상에 넣을 음성 대본',true)}${field('credit','사용한 외부 자료 및 출처','음악·사진·영상·자료를 기록하세요.',true)}${check('edited','장면 순서와 소리·자막을 직접 점검했어요.')}`;
case'test':return `<div class="grid2"><div class="panel"><h3>이야기·내용 점검</h3>${['주제가 처음부터 끝까지 일관돼요.','실제 사실과 자료를 확인했어요.','시작·전개·마무리가 이해돼요.','AI가 만든 오류·편견을 점검했어요.'].map((x,i)=>check('review'+i,x)).join('')}</div><div class="panel"><h3>화면·소리 점검</h3>${['캐릭터의 외형이 이어져요.','화면이 어색하게 왜곡되지 않아요.','자막과 음성이 잘 들리고 읽혀요.','음악과 이미지의 사용 조건을 확인했어요.'].map((x,i)=>check('tech'+i,x)).join('')}</div></div>${field('testIssue','발견한 문제와 수정 이유','예: 3번째 클립은 손 모양이 이상해 새로 만들었어요.',true)}${field('testFix','최종 수정 내용','무엇을 바꾸었나요?',true)}${check('tested','수정한 영상을 처음부터 다시 재생해 확인했어요.')}`;
case'publish':return `${field('finalTitle','최종 영상 제목',F('project'))}${field('finalMessage','관객에게 전하고 싶은 메시지',F('message'),true)}${upload('finalVideo','완성한 영상 파일 선택','video/*')}${field('share','교사에게 제출한 방법 또는 공유 링크(선택)','선생님이 지정한 제출처 또는 주소')}${check('finalOwned','최종 영상 원본을 내 기기에 저장했어요.')}${check('finalSent','교사가 안내한 제출처에 실제로 제출했어요.')}${note('이 HTML 안에서 파일을 선택하는 것만으로 교사에게 영상이 제출되지는 않습니다. 원본 파일을 선생님이 안내한 곳에 따로 제출해야 해요.')}`;
case'reflect':return `${field('myWork','AI가 아니라 내가 직접 결정한 것','예: 결말과 캐릭터를 정하고 대사를 고쳤어요.',true)}${field('revisionLog','가장 중요했던 디버깅·수정','어떤 문제를 어떻게 해결했나요?',true)}${field('peer','친구 작품에서 배운 점','좋았던 장면과 그 이유',true)}${field('next','다음에 영상을 만든다면 개선하고 싶은 점','다음 계획',true)}${note('원래 교안의 발표·공유 및 창작 성찰 활동과 연결됩니다. 한 문장씩이라도 내가 한 선택을 구체적으로 기록하세요.',true)}<button class="primary" id="printBtn">나의 제작 과정 인쇄 / PDF로 저장</button>`;
}}
function summary(){return `<div class="kicker">MY CREATION RECORD</div><h1>나의 영상 제작 기록</h1><div class="panel"><p><b>이름·활동명:</b> ${esc(F('student'))}</p><p><b>제목:</b> ${esc(F('finalTitle')||F('project'))}</p><p><b>주제:</b> ${esc(F('topic'))}</p><p><b>대상:</b> ${esc(F('audience'))}</p><p><b>메시지:</b> ${esc(F('message'))}</p><p><b>형식:</b> ${esc(F('genre'))}</p></div><h2>장면별 스토리보드</h2>${data.scenes.map((s,i)=>`<div class="panel"><h3>${i+1}장면</h3><p class="status" style="white-space:pre-wrap">${esc(sceneSummary(s,i))}</p><p>수정 메모: ${esc(s.review)}</p></div>`).join('')}<h2>분석과 성찰</h2><div class="panel">${[['발견한 오류','issues'],['수정 요청','fix'],['편집 도구','editor'],['자료 출처','credit'],['최종 수정','testFix'],['내가 결정한 것','myWork'],['친구 작품에서 배운 점','peer']].map(([a,b])=>`<p><b>${a}:</b> ${esc(F(b))}</p>`).join('')}</div><button class="primary" id="printBtn">인쇄 / PDF로 저장</button><button data-go="home">작업실로 돌아가기</button>`}
function render(){renderSide();let id=data.current;$('#main').innerHTML=id==='home'?home():id==='summary'?summary():`<div class="row between"><span class="kicker">${groups.find(g=>g.ids.includes(id))?.name||''}</span><span class="tag gold">STEP ${titles.findIndex(x=>x[0]===id)+1} / ${titles.length}</span></div><h1>${esc(titles.find(x=>x[0]===id)?.[1])}</h1><p class="sub">각 단계를 직접 실행하고, 결과를 확인·수정한 후 다음으로 넘어가세요.</p>${page(id)}<div class="stepfoot"><button id="prevBtn">← 이전 단계</button><button class="primary" id="nextBtn">${id==='reflect'?'활동 완료 ✓':'저장하고 다음 →'}</button></div><div class="bottom">효돈중학교 · 나는야 K-크리에이터! · 영상은 외부 AI 서비스/편집 도구에서 제작합니다.</div>`;$('#saved').textContent='✓ 이 기기에 저장됨'}function go(id){data.current=id;store();render();scrollTo({top:0,behavior:'instant'});$('#shell').classList.remove('show-menu')}
function download(name,content,type){let b=new Blob([content],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}document.addEventListener('input',e=>{let t=e.target;if(t.dataset.field){data.fields[t.dataset.field]=t.value;store()}if(t.dataset.scene!==undefined){data.scenes[+t.dataset.scene][t.dataset.prop]=t.value;store()}});document.addEventListener('change',e=>{let t=e.target;if(t.dataset.check){data.checks[t.dataset.check]=t.checked;store()}if(t.dataset.upload){let f=t.files[0];if(!f)return;data.files[t.dataset.upload]=f.name;store();if(urls[t.dataset.upload])URL.revokeObjectURL(urls[t.dataset.upload]);urls[t.dataset.upload]=URL.createObjectURL(f);let box=$('#preview-'+t.dataset.upload);if(box)box.innerHTML=f.type.startsWith('video/')?`<video class="preview" controls src="${urls[t.dataset.upload]}"></video>`:`<img class="preview" alt="선택한 이미지" src="${urls[t.dataset.upload]}">`;let p=t.closest('.panel')?.querySelector('.status');if(p)p.textContent='등록한 파일명: '+f.name+' · 원본 파일은 내 기기에 따로 보관하세요.'}});document.addEventListener('click',async e=>{let t=e.target.closest('button');if(!t)return;if(t.dataset.go){go(t.dataset.go);return}if(t.dataset.copy){let el=$('#prompt-'+t.dataset.copy);try{await navigator.clipboard.writeText(el.innerText);t.textContent='복사 완료 ✓';setTimeout(()=>t.textContent='복사하기',1500)}catch{let sel=window.getSelection();let r=document.createRange();r.selectNodeContents(el);sel.removeAllRanges();sel.addRange(r);alert('문구를 선택했습니다. Ctrl+C로 복사하세요.')}return}if(t.id==='nextBtn'||t.id==='prevBtn'){let i=titles.findIndex(x=>x[0]===data.current);if(t.id==='nextBtn'){if(!data.done.includes(data.current))data.done.push(data.current);go(titles[i+1]?.[0]||'summary')}else go(titles[i-1]?.[0]||'home')}if(t.id==='summaryBtn')go('summary');if(t.id==='printBtn')print();if(t.id==='menuBtn')$('#shell').classList.toggle('show-menu');if(t.id==='backupBtn')download('나의_AI영상_작업백업.json',JSON.stringify(data,null,2),'application/json');if(t.id==='importBtn')$('#importFile').click()});$('#importFile').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let v=JSON.parse(await f.text());if(!Array.isArray(v.scenes)||!v.fields)throw Error();if(confirm('현재 기록을 선택한 백업 기록으로 바꿀까요?')){data={...fresh(),...v};store();render()}}catch{alert('올바른 작업실 백업 JSON 파일이 아닙니다.')}e.target.value=''});render();
</script></body></html>
