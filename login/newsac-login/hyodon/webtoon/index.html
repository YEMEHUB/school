['scriptprompt',4,'8컷 대본 요청하기','내 기획과 캐릭터가 요청 문구에 자동으로 연결됩니다.'],
['script',4,'대본 가져오기','제미나이의 결과를 붙여넣고 8개의 장면으로 나누세요.'],

case'image':return instructions(['요청 문구를 복사해 제미나이에서 이미지를 만드세요.','완성된 이미지를 내 기기에 다운로드하세요.','아래에서 파일을 선택해 작업실에 올리세요.'])+promptBox('image',imagePrompt)+upload('practice','체험 이미지 올리기',state.practiceImage);
case'imagecheck':return `<div class="grid2"><div>${state.practiceImage?`<img class="uploaded" src="${state.practiceImage}" alt="나의 체험 이미지">`:notice('이전 단계에서 체험 이미지를 올려주세요.')}</div><div>${['학생이 한 명인가요?','물병이 파란색 한 개인가요?','가방이 노란색인가요?','글자와 말풍선이 없나요?'].map((q,i)=>selectField('imgcheck'+i,q,['맞음','수정 필요'])).join('')}</div></div>${field('imageReason','잘 맞았거나 다른 부분 한 가지','예: 가방이 파란색으로 나와서 노란색으로 수정해야 해요.',true)}${notice('요청 조건 외에도 손 모양, 물건의 개수, 앞뒤 상황을 살펴보세요. 오류가 반드시 생기는 것은 아닙니다.')}`;
case'ethics':return `<div class="panel"><span class="tag gold">수업용 비교 예시 · 실제 AI 출력 인용 아님</span><h2 style="margin-top:16px">요청은 3문장, 결과는?</h2><div class="quote">민우는 복도에서 물병을 발견했다.<br>누구의 물병인지 궁금했다.<br>그냥 지나갈까 잠시 고민했다.<br>민우는 물병을 선생님께 가져다드렸다.</div>${field('errorAnswer','요청과 다른 부분은 무엇인가요?','무엇을 보고 그렇게 판단했나요?')}<details><summary>답을 적은 뒤 해설 보기</summary><p>요청은 3문장인데 결과는 4문장이에요. 자연스러운 내용이지만 문장 수 조건을 지키지 않았습니다. 이는 사실 오류와 구분되는 ‘조건 불충족’입니다. 실제 정보도 그럴듯하게 틀릴 수 있으므로 확인이 필요해요.</p></details></div>${['친구의 얼굴을 허락 없이 재미있는 합성 이미지로 만들기','AI가 만든 내용을 확인하지 않고 사실이라고 알리기','특정 사람이나 집단을 편견에 따라 표현하기'].map((q,i)=>`<div class="panel"><h3>${i+1}. ${q}</h3>${selectField('ethic'+i,'나의 판단',['그대로 진행','고쳐서 진행','하지 않기'])}${field('ethicReason'+i,'그렇게 생각한 이유','이유를 한 문장으로 적으세요.')}<details><summary>해설 보기</summary><p>${['친구의 얼굴을 허락 없이 합성하지 않아요. 자료를 사용할 때 허락과 사용 조건을 확인합니다.','확인하지 않은 내용을 사실이라고 퍼뜨리지 않아요. 확인 가능한 자료와 대조한 뒤 사용합니다.','특정 사람이나 집단을 부당하게 표현하지 않아요. 편견을 발견하면 내용과 표현을 고칩니다.'][i]}</p></details></div>`).join('')}`;
case'pledge':return `<div class="panel">${field('pledgeInfo','정보를 사용할 때는…','사실인지 확인한 뒤 사용하겠습니다.')}${field('pledgeRights','다른 사람의 사진이나 작품을 사용할 때는…','허락과 사용 조건을 확인하겠습니다.')}${field('pledgeFix','오류나 편견을 발견하면…','그대로 제출하지 않고 수정하겠습니다.')}</div>${notice('이 약속은 이후 기획과 제작 과정에서도 다시 확인할 수 있어요.',true)}`;
case'topics':return `${notice('시작이 어렵다면 <strong>쓰레기 분리배출</strong>, <strong>길거리 킥보드 안전</strong>, 또는 내가 직접 관찰한 생활 속 문제를 떠올려 보세요.')}<div class="grid2"><div class="panel"><h3>후보 01</h3>${field('candidate1','관심 있는 주제','나는 무엇이 궁금한가요?')}${field('candidateWhy1','관심을 가진 이유','그 이유는…',true)}</div><div class="panel"><h3>후보 02</h3>${field('candidate2','관심 있는 주제','또 다른 주제를 떠올려 보세요.')}${field('candidateWhy2','관심을 가진 이유','그 이유는…',true)}</div></div>`;
case'audience':return `<div class="row">${['candidate1','candidate2'].filter(k=>F(k)).map(k=>`<button class="small" data-use-topic="${k}">${esc(F(k))} 선택</button>`).join('')}</div>${field('tentative','잠정 주제','예: 분리배출할 때 겪는 어려움')}${field('audience','웹툰을 보여줄 대상','예: 우리 반 학생')}${field('research','설문으로 알아보고 싶은 것','예: 어떤 점이 가장 헷갈리는지',true)}${notice('설문에서 가장 많은 답을 무조건 주제로 고르는 것은 아니에요. 응답을 읽고 내 기획의 근거로 활용합니다.')}`;
case'survey':return `${notice('객관식은 경향을 비교하고, 주관식은 구체적인 경험과 의견을 듣기 위해 사용해요. 객관식은 <strong>한 개 선택</strong>으로 만드세요.')} ${state.survey.map((q,i)=>`<div class="panel"><div class="row spread"><h3>질문 ${i+1}</h3><span class="tag">${q.type}</span></div><div class="field"><label for="q${i}">질문 내용</label><input type="text" id="q${i}" data-survey="${i}" data-key="q" value="${esc(q.q)}" maxlength="500"></div>${q.type==='객관식'?`<div class="field"><label for="o${i}">보기 · 한 줄에 하나씩</label><textarea id="o${i}" data-survey="${i}" data-key="options" placeholder="주제에 맞는 보기를 2개 이상 적으세요." maxlength="3000">${esc(q.options)}</textarea></div>`:''}</div>`).join('')} ${check('surveyPrivacy','이름·연락처 등 불필요한 개인정보를 묻지 않았어요.')}`;
case'links':promptCache.survey=surveyText();return instructions(['아래 제목·설명·질문·보기를 한 항목씩 직접 선택해 복사하세요.','구글 설문에서 새 설문을 만들고 해당 입력칸에 하나씩 붙여넣으세요. 전체 내용을 한 번에 붙여넣는 기능은 아닙니다.','필요하지 않은 이메일 수집 등이 켜져 있지 않은지 선생님과 확인하세요.','응답용 링크를 아래에 저장하고, 선생님이 지정한 친구들의 설문에 답하세요.'])+`<div class="row"><a class="external" href="https://forms.google.com" target="_blank" rel="noopener noreferrer">구글 설문 열기 ↗</a></div><pre class="prompt">${esc(surveyText())}</pre>${field('surveyLink','응답용 설문 링크','https://…')}${field('editLink','내 설문 관리 주소 — 입력하지 않아도 됩니다','질문 수정·응답 확인 화면의 주소',false,'설문을 만든 사람이 관리할 때 쓰는 주소입니다. 친구에게 보낼 응답용 링크와 달라요.')}${field('responseCount','현재 응답 수 · 선택','숫자로 적으세요.')}${notice('응답 수집과 CSV 다운로드는 구글 설문에서 별도로 진행합니다. 이 사이트가 설문 응답을 자동으로 가져오지는 않아요.')}`;
case'day1':return `<div class="panel"><h2>다음 시간에 다시 만날 나의 기획</h2><p><strong>잠정 주제</strong> · ${esc(F('tentative')||'아직 입력하지 않았어요.')}</p><p><strong>전달 대상</strong> · ${esc(F('audience')||'아직 입력하지 않았어요.')}</p><p><strong>알아볼 내용</strong> · ${esc(F('research')||'아직 입력하지 않았어요.')}</p></div>${notice('다음 날 다른 컴퓨터를 쓴다면 <strong>작업 백업 파일</strong>을 가져와야 합니다. 파일을 학교에서 허용한 개인 저장 공간에 보관하세요.')}<button class="primary" data-action="backup">첫날 작업 백업 다운로드 ↓</button>${check('day1Backed','백업 파일을 내려받아 보관했어요.')}<p class="muted" style="margin-top:20px">둘째 날: 응답 확인 → 기획 확정 → 캐릭터 만들기</p>`;
case'csv':return instructions(['구글 설문에서 응답을 CSV 파일로 내려받으세요.','아래에서 파일을 선택하세요.','미리보기에서 질문과 한글이 제대로 보이는지 확인하세요.'])+`<div class="panel"><div class="field"><label for="encoding">한글 읽기 방식</label><select id="encoding"><option value="utf-8">UTF-8 · 구글 설문 기본</option><option value="euc-kr">한글이 깨질 때 · EUC-KR</option></select></div><label class="upload">설문 응답 CSV 올리기<input type="file" accept=".csv,text/csv" id="csv-file"></label><p class="muted" style="font-size:.8em">최대 10MB · 5,000개 응답까지. 실제 설문 응답만 사용하세요.</p></div>${state.csv.headers.length?`<div class="row spread"><strong>${esc(state.csv.name)}</strong><span class="tag">${state.csv.rows.length}개 응답 · ${state.csv.headers.length}개 열</span></div><div class="table-scroll"><table><thead><tr>${state.csv.headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${state.csv.rows.map(r=>`<tr>${state.csv.headers.map((_,i)=>`<td>${esc(r[i]||'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="muted" style="font-size:.8em">전체 응답을 보여줍니다. 표를 위아래·좌우로 스크롤해 확인하세요. CSV는 이 기기에서 처리됩니다.</p>`:''}`;
case'analyze':return analyzeBody();
case'insight':return `${field('finding','객관식에서 발견한 점','응답자들은 __________을 많이 선택했다.',true)}${field('opinion','주관식에서 발견한 점','자유 의견에서는 __________이라는 내용이 나타났다.',true)}${field('decision','그래서 웹툰에 반영할 점','그래서 웹툰에는 __________을 담겠다.',true)}${notice('실제 응답에 없는 숫자나 의견을 만들지 않아요. 우리 반의 일부 응답을 전체 중학생의 생각처럼 표현하지 않습니다.')}`;
case'plan':return `${notice('설문을 참고해 주제와 메시지를 확정하세요. 다음 단계에서 이 이야기에 필요한 캐릭터를 정합니다.',true)}${field('topic','확정 주제',F('tentative')||'어떤 이야기를 만들까요?')}${field('audience','전달 대상','누구에게 보여줄까요?')}${field('message','핵심 메시지 한 문장','읽고 나서 무엇을 알거나 느끼면 좋을까요?',true)}${field('mood','이야기의 분위기','예: 밝고 친근한, 진지한, 유쾌한')}<div class="panel"><span class="tag gold">형식 고정 · 8컷 웹툰</span><p style="margin-top:15px">설문에서 참고한 내용: ${esc(F('finding'))}</p><p>반영할 점: ${esc(F('decision'))}</p></div>`;
case'character':return `<div class="quote">내 메시지: ${esc(F('message')||'기획 단계에서 핵심 메시지를 먼저 정해주세요.')}</div>${notice('주인공 한 명을 중심으로 시작하세요. 이야기에 필요할 때 조연을 추가할 수 있어요.')}<div class="grid2">${field('charName','주인공 이름','이름을 지어주세요.')}${field('charRole','이야기 속 역할','예: 문제를 겪고 해결 방법을 찾아보는 학생')}${field('charPersonality','성격','예: 호기심이 많고 신중함')}${field('charHair','머리 모양','길이와 색 등을 구체적으로')}${field('charClothes','옷과 대표 색','장면마다 유지할 옷')}${field('charFeature','유지할 특징','예: 둥근 안경, 노란 가방')}</div>`;
case'reference':return need(['topic','message','charName','charRole','charHair','charClothes'])?notice('기획과 캐릭터 설정을 먼저 작성해주세요. 왼쪽 순서에서 돌아갈 수 있습니다.'):`${promptBox('reference',characterPrompt())}${upload('reference','캐릭터 기준 이미지 올리기',state.referenceImage)}${check('charChecked','설정과 이미지를 비교하고, 이 이미지를 기준으로 사용하겠어요.')}${notice('같은 기준 이미지를 사용해도 캐릭터가 완벽히 유지되지는 않을 수 있어요. 매 장면에서 외형을 확인하세요.')}`;
case'scriptprompt':return need(['topic','message','audience','charName'])?notice('주제·전달 대상·핵심 메시지·캐릭터를 먼저 작성해주세요.'):`<div class="grid2"><div class="quote">${esc(planningText())}</div><div class="quote">${esc(characterText())}</div></div>${promptBox('script',scriptPrompt())}${notice('제미나이 결과를 복사한 뒤, 다음 단계의 ‘대본 가져오기’에 붙여넣으세요.')}${check('scriptRequested','내 기획이 들어간 요청 문구를 제미나이에서 실행했어요.')}`;
case'script':return `${field('rawScript','제미나이가 작성한 8컷 대본','[1컷]\n장면: …\n대사: …\n필수 요소: …',true)}<button class="yellow" data-action="parse-script">8컷으로 나누기</button>${notice('자동 분리는 [1컷]부터 [8컷]까지의 형식을 사용합니다. 결과가 다르게 나왔다면 아래 카드에 직접 입력할 수 있어요. 빈 장면을 사이트가 임의로 채우지는 않습니다.')}<div class="grid2">${state.cuts.map((c,i)=>cutFields(c,i)).join('')}</div>`;
case'review':promptCache.revise=`전체 8컷의 구성과 캐릭터 설정은 유지해 줘.\n다음 내용을 수정해 줘: ${F('revision')}\n수정할 이유: ${F('revisionReason')}\n수정한 컷을 [번호컷], 장면:, 대사:, 필수 요소: 형식으로 보여줘.\n\n현재 대본:\n${scriptText()}`;return `<div class="mini-grid">${state.cuts.map((c,i)=>`<div class="mini-cut"><strong>${i+1}컷</strong><p>${esc(c.scene||'장면 미입력')}</p><p class="muted">${esc(c.dialogue)}</p></div>`).join('')}</div>${check('reviewFlow','8개의 장면이 순서대로 자연스럽게 이어져요.')}${check('reviewMessage','핵심 메시지가 드러나요.')}${check('reviewFacts','사실 확인이 필요한 내용을 점검했어요.')}${field('revision','확인하거나 고칠 부분','예: 3컷의 대사가 너무 길어서 짧게 바꾸기',true)}${field('revisionReason','확인 또는 수정 이유','왜 그렇게 판단했나요?',true)}<div class="row"><button data-go="script">대본 카드에서 직접 수정</button></div>${notice('수정 결과는 대본 카드의 해당 컷에 직접 반영하세요. 전체 붙여넣기를 다시 실행하면 기존 대본을 바꿀 수 있으니 확인이 필요합니다.')} ${check('scriptFinal','8컷 대본을 확인하고 이미지 제작 기준으로 확정했어요.')}`;
case'scenes':return wholeWebtoonBody();
case'status':return instructions(['제미나이에서 만든 8컷 전체 이미지를 기기에 다운로드하세요.','아래에 이미지를 올린 뒤 1컷부터 8컷까지 읽어보세요.','빠진 컷, 캐릭터 변화, 대사와 글자 오류를 찾아 다음 단계에 적으세요.'])+upload('webtoon-initial','최초 8컷 웹툰 이미지 올리기',state.webtoon.initial)+check('initialChecked','8컷의 순서·대사·캐릭터를 확인했어요.');
case'editor':return revisionBody(1);

function parseCSV(text){text=text.replace(/^\uFEFF/,'');const first=text.split(/\r?\n/)[0]||'';let delimiter=first.includes('\t')?'\t':first.split(';').length>first.split(',').length?';':',';let rows=[],row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){let ch=text[i];if(ch==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else if(quoted||cell==='')quoted=!quoted;else cell+=ch}else if(ch===delimiter&&!quoted){row.push(cell);cell=''}else if((ch==='\n'||ch==='\r')&&!quoted){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=ch}if(quoted)throw Error('따옴표가 닫히지 않은 CSV입니다. 원본을 다시 내려받아 주세요.');row.push(cell);if(row.some(x=>x.trim()))rows.push(row);if(rows.length<2)throw Error('질문 제목과 응답이 한 줄 이상 있는 CSV가 필요합니다.');if(rows.length>5001)throw Error('응답은 최대 5,000개까지 읽을 수 있습니다.');let headers=rows.shift().map((x,i)=>x.trim()||'제목 없는 열 '+(i+1));if(headers.length>200)throw Error('열이 너무 많습니다. 설문 응답 파일인지 확인해주세요.');if(rows.some(r=>r.length!==headers.length))throw Error('열 개수가 맞지 않는 행이 있습니다. 구글 설문에서 CSV를 다시 내려받아 주세요.');return {headers,rows}}

function wholeWebtoonBody(){return instructions(['캐릭터 기준 이미지를 다운로드하세요.','제미나이에 기준 이미지를 첨부하고 아래 요청 문구를 붙여넣으세요.','정확히 8컷인지 확인하고 전체 웹툰 이미지를 다운로드하세요.','5차시의 최초 웹툰 확인 화면에 이미지를 올리세요.'])+(state.referenceImage?wholeImage(state.referenceImage,'캐릭터 기준')+'<button data-action="reference-download">기준 이미지 다운로드 ↓</button>':notice('캐릭터 기준 이미지를 먼저 준비하세요.'))+promptBox('whole',`첨부한 기준 이미지의 캐릭터를 유지하며 아래 대본 전체를 한 장의 8컷 웹툰 이미지로 만들어 줘. 정확히 8개 칸을 2열 4행으로 배치하고 왼쪽에서 오른쪽, 위에서 아래로 읽게 해 줘. 각 컷 번호를 1~8로 표시해 줘. 대본의 대사와 설명을 한국어 말풍선과 설명 상자에 읽기 좋게 넣어 줘. 컷을 생략하거나 중복하지 마.\n[기획]\n${planningText()}\n[캐릭터]\n${characterText()}\n[확정 대본]\n${scriptText()}`)+notice('이미지 첨부는 직접 해야 해요. 생성 결과가 요청과 다를 수 있으므로 8컷 수와 글자를 꼭 확인하세요.')}
function revisionBody(n){let prev=n===1?state.webtoon.initial:state.webtoon.revision1;return wholeImage(prev,n===1?'최초 웹툰':'1차 수정본')+field('fix'+n,`${n}차 수정할 부분`,'예: 3컷의 주인공 옷을 기준 이미지와 같은 노란색으로 바꿔 주세요.',true)+field('fixReason'+n,'수정하는 이유','어떤 점을 더 정확하거나 이해하기 쉽게 바꾸나요?',true)+instructions(['위에 수정할 컷 번호와 바꿀 내용을 구체적으로 적으세요.','아래 요청 문구를 복사하고, 제미나이에 지금 확인한 웹툰 이미지도 첨부하세요.','수정 결과를 다운로드하여 아래에 올리고 요청대로 바뀌었는지 기록하세요.'])+promptBox('fix'+n,`첨부한 전체 8컷 웹툰을 수정해 줘. 수정 대상 외의 이야기 순서, 캐릭터와 대사는 유지하고 전체 8컷 이미지를 다시 만들어 줘.\n수정 요청: ${F('fix'+n)||'(위 입력란에 수정할 내용을 먼저 적으세요.)'}\n수정 이유: ${F('fixReason'+n)}\n정확히 8컷을 유지하고 한국어 글자를 읽기 좋게 표현해 줘.`)+upload('webtoon-revision'+n,`${n}차 수정한 8컷 웹툰 이미지 올리기`,state.webtoon['revision'+n])+field('fixCheck'+n,'수정 결과 확인','요청한 내용이 어떻게 반영되었나요? 남은 문제도 적으세요.',true)}

async function readImage(file){if(!/^image\/(png|jpeg|webp)$/.test(file.type))throw Error('PNG, JPG, WebP 이미지를 선택해주세요.');if(file.size>20*1024*1024)throw Error('이미지는 한 장당 20MB 이하로 올려주세요.');let url=URL.createObjectURL(file);try{let im=await loadImage(url);if(!im.width||!im.height||im.width*im.height>100000000)throw Error('이미지 크기가 너무 큽니다. 더 작은 이미지로 저장해주세요.');let scale=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);let x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);return c.toDataURL('image/jpeg',.9)}finally{URL.revokeObjectURL(url)}}
const imageCache=new Map;function loadImage(src){if(imageCache.has(src))return imageCache.get(src);let p=new Promise((res,rej)=>{let im=new Image;im.onload=()=>res(im);im.onerror=()=>{imageCache.delete(src);rej(Error('이미지를 읽지 못했습니다. 다시 올려주세요.'))};im.src=src});if(imageCache.size>30)imageCache.clear();imageCache.set(src,p);return p}
function wrapText(ctx,text,maxWidth){let lines=[];for(const part of String(text).split('\n')){let line='';for(const ch of Array.from(part)){if(line&&ctx.measureText(line+ch).width>maxWidth){lines.push(line);line=ch}else line+=ch}lines.push(line)}return lines}
function roundRect(ctx,x,y,w,h,r=14){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
async function paintCut(canvas,index,editing=false){let cut=state.cuts[index],ctx=canvas.getContext('2d');canvas.width=800;canvas.height=600;ctx.fillStyle='#fffefa';ctx.fillRect(0,0,800,600);if(cut.image){let im=await loadImage(cut.image);let scale=cut.fit==='cover'?Math.max(800/im.width,600/im.height):Math.min(800/im.width,600/im.height);let w=im.width*scale,h=im.height*scale;ctx.drawImage(im,(800-w)*cut.offsetX/100,(600-h)*cut.offsetY/100,w,h)}else{ctx.fillStyle='#eaf0e5';ctx.fillRect(0,0,800,600);ctx.fillStyle='#7f927d';ctx.font='24px "Malgun Gothic",sans-serif';ctx.textAlign='center';ctx.fillText(`${index+1}컷 · 이미지를 올려주세요`,400,300)}let over=[];for(let i=0;i<cut.bubbles.length;i++){let b=cut.bubbles[i],x=b.x*8,y=b.y*6,w=b.w*8,h=b.h*6;ctx.save();ctx.fillStyle=b.type==='caption'?'#fff2bf':'#ffffff';ctx.strokeStyle='#263d32';ctx.lineWidth=2;roundRect(ctx,x,y,w,h,b.type==='caption'?3:18);ctx.fill();ctx.stroke();if(b.type==='speech'&&y+h+12<600){ctx.beginPath();ctx.moveTo(x+25,y+h-1);ctx.lineTo(x+34,y+h+12);ctx.lineTo(x+52,y+h-1);ctx.fill();ctx.stroke()}ctx.font=`${b.font}px "Malgun Gothic","Apple SD Gothic Neo",sans-serif`;ctx.textAlign='left';ctx.textBaseline='top';let lines=wrapText(ctx,b.text,w-24),lineH=b.font*1.4,maxLines=Math.floor((h-18)/lineH);if(lines.length>maxLines)over.push(i+1);ctx.beginPath();ctx.rect(x+9,y+8,w-18,h-16);ctx.clip();ctx.fillStyle='#1f352b';lines.slice(0,maxLines).forEach((line,j)=>ctx.fillText(line,x+12,y+9+j*lineH));ctx.restore();if(editing&&i===selectedBubble){ctx.strokeStyle='#bd8b08';ctx.lineWidth=3;ctx.setLineDash([8,5]);ctx.strokeRect(x-3,y-3,w+6,h+6);ctx.setLineDash([])}}ctx.strokeStyle='#2b4135';ctx.lineWidth=2;ctx.strokeRect(1,1,798,598);return over}
let drawToken=0;async function drawEditor(){const canvas=$('#editor-canvas');if(!canvas)return;let token=++drawToken;try{let off=document.createElement('canvas'),over=await paintCut(off,selectedCut,true);if(token!==drawToken||!canvas.isConnected)return;canvas.getContext('2d').drawImage(off,0,0);let warning=$('#overflow-warning');warning.hidden=!over.length;warning.textContent='';if(over.length)warning.textContent=`${over.join(', ')}번 말풍선/설명에 글자가 넘쳐요. 문장을 줄이거나 상자를 키워주세요.`}catch(e){toast(e.message,true)}}
async function makePage(page){let canvas=document.createElement('canvas');canvas.width=1600;canvas.height=1450;let ctx=canvas.getContext('2d');ctx.fillStyle='#faf9f3';ctx.fillRect(0,0,1600,1450);ctx.fillStyle='#176b54';ctx.font='bold 22px "Malgun Gothic",sans-serif';ctx.fillText('MY WEBTOON · 효돈중학교',60,52);ctx.fillStyle='#203c30';ctx.font='bold 42px "Malgun Gothic",sans-serif';let title=F('workTitle')||state.project.name;let lines=wrapText(ctx,title,1450);if(lines.length>2)throw Error('작품 제목이 너무 깁니다. 두 줄 안에 들어가도록 줄여주세요.');lines.forEach((l,i)=>ctx.fillText(l,60,111+i*48));for(let j=0;j<4;j++){let i=page*4+j,cut=document.createElement('canvas');await paintCut(cut,i);let x=60+(j%2)*756,y=190+Math.floor(j/2)*600;ctx.drawImage(cut,x,y,724,543);ctx.fillStyle='#176b54';ctx.font='bold 18px "Malgun Gothic",sans-serif';ctx.fillText(String(i+1).padStart(2,'0'),x,y-12)}ctx.fillStyle='#657969';ctx.font='20px "Malgun Gothic",sans-serif';ctx.fillText(state.project.alias?`만든 사람 · ${state.project.alias}`:'나의 8컷 웹툰',60,1395);ctx.textAlign='right';ctx.fillText(`${page+1} / 2`,1540,1395);return canvas}

function exportProblem(requireTitle=true){let missing=state.cuts.map((c,i)=>c.image?-1:i+1).filter(x=>x>0);if(missing.length)return`${missing.join(', ')}번 컷의 이미지를 넣어주세요.`;if(!state.cuts.some(c=>c.bubbles.some(b=>b.text.trim())))return'작품에 대사 또는 설명을 하나 이상 넣어주세요. 대본의 글은 편집 화면에서 말풍선으로 추가해야 합니다.';if(requireTitle&&!F('workTitle').trim())return'작품 제목을 입력해주세요.';return''}
function makePDF(canvases){let enc=new TextEncoder(),chunks=[],offset=0,offsets=[0];const add=x=>{let b=typeof x==='string'?enc.encode(x):x;chunks.push(b);offset+=b.length}, obj=(id,body)=>{offsets[id]=offset;add(`${id} 0 obj\n`);add(body);add('\nendobj\n')};add('%PDF-1.4\n');obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,`<< /Type /Pages /Kids [${canvases.map((_,i)=>(3+i*3)+' 0 R').join(' ')}] /Count ${canvases.length} >>`);canvases.forEach((c,i)=>{let id=3+i*3,jpg=Uint8Array.from(atob(c.toDataURL('image/jpeg',.94).split(',')[1]),x=>x.charCodeAt(0)),w=595,h=595*c.height/c.width;obj(id,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${w} ${h}] /Resources << /XObject << /Im${i} ${id+2} 0 R >> >> /Contents ${id+1} 0 R >>`);let stream=`q ${w} 0 0 ${h} 0 0 cm /Im${i} Do Q`;obj(id+1,`<< /Length ${enc.encode(stream).length} >>\nstream\n${stream}\nendstream`);offsets[id+2]=offset;add(`${id+2} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${c.width} /Height ${c.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);add(jpg);add('\nendstream\nendobj\n')});let xref=offset;add(`xref\n0 ${3+canvases.length*3}\n0000000000 65535 f \n`);for(let i=1;i<3+canvases.length*3;i++)add(String(offsets[i]).padStart(10,'0')+' 00000 n \n');add(`trailer\n<< /Size ${3+canvases.length*3} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);return new Blob(chunks,{type:'application/pdf'})}
async function exportWork(kind){let problem=exportProblem();if(problem){toast(problem,true);return}busy(true,'웹툰 파일을 만들고 있어요…');try{for(let i=0;i<8;i++){let c=document.createElement('canvas'),over=await paintCut(c,i);if(over.length)throw Error(`${i+1}컷의 ${over.join(', ')}번 말풍선/설명에서 글자가 넘칩니다. 편집 화면에서 수정해주세요.`)}if(kind==='pdf'){let pages=[await makePage(0),await makePage(1)];download(makePDF(pages),safeName()+'.pdf')}else{let page=kind==='png0'?0:1,c=await makePage(page);let blob=await new Promise(r=>c.toBlob(r,'image/png'));download(blob,safeName()+`_${page+1}페이지.png`)}toast('완성본 다운로드를 요청했어요. 파일을 열어 확인하세요.')}catch(e){toast(e.message,true)}finally{busy(false)}}
function normalizeBackup(raw){if(raw?.format!=='hyodon-webtoon-backup'||raw.version!==1||raw.data?.version!==1)throw Error('이 작업실의 버전 1 백업 파일이 아닙니다.');let d=raw.data,n=fresh();const str=(x,max=12000)=>typeof x==='string'?x.slice(0,max):'';const img=x=>{if(!x)return'';if(typeof x!=='string'||x.length>30000000||!/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(x))throw Error('백업에 지원하지 않는 이미지가 있습니다.');return x};n.project={name:str(d.project?.name,80)||'나의 웹툰',alias:str(d.project?.alias,40)};if(!d.fields||typeof d.fields!=='object'||Array.isArray(d.fields))throw Error('입력 내용 형식이 올바르지 않습니다.');for(const[k,v]of Object.entries(d.fields)){if(!/^[a-zA-Z][a-zA-Z0-9]*$/.test(k)||['constructor','prototype','__proto__'].includes(k))continue;n.fields[k]=typeof v==='boolean'?v:str(v)}n.done=Array.isArray(d.done)?[...new Set(d.done.filter(id=>steps.some(s=>s.id===id)))]:[];n.current=steps.some(s=>s.id===d.current)?d.current:'home';n.font=[0,1,2].includes(d.font)?d.font:0;n.practiceImage=img(d.practiceImage);n.referenceImage=img(d.referenceImage);for(const k of ['initial','revision1','revision2','final'])n.webtoon[k]=img(d.webtoon?.[k]);if(!Array.isArray(d.cuts)||d.cuts.length!==8)throw Error('8컷 데이터가 필요합니다.');const num=(v,lo,hi,def)=>typeof v==='number'&&Number.isFinite(v)?Math.max(lo,Math.min(hi,v)):def;n.cuts=d.cuts.map(c=>({scene:str(c.scene,3000),dialogue:str(c.dialogue,3000),essential:str(c.essential,3000),image:img(c.image),fit:c.fit==='cover'?'cover':'contain',offsetX:num(c.offsetX,0,100,50),offsetY:num(c.offsetY,0,100,50),bubbles:(Array.isArray(c.bubbles)?c.bubbles:[]).slice(0,12).map(b=>{let w=num(b.w,15,96,70),h=num(b.h,10,70,25);return{type:b.type==='caption'?'caption':'speech',text:str(b.text,600),w,h,x:num(b.x,0,100-w,8),y:num(b.y,0,100-h,65),font:num(b.font,16,42,26)}})}));if(Array.isArray(d.survey)&&d.survey.length===5)n.survey=d.survey.map((q,i)=>({q:str(q.q,500),type:i===4?'주관식':'객관식',options:str(q.options,3000)}));if(d.csv?.headers?.length){if(!Array.isArray(d.csv.headers)||!Array.isArray(d.csv.rows)||d.csv.headers.length>200||d.csv.rows.length>5000)throw Error('CSV 데이터 크기가 올바르지 않습니다.');n.csv={name:str(d.csv.name,200),headers:d.csv.headers.map(h=>str(h,1000)),rows:d.csv.rows.map(r=>{if(!Array.isArray(r)||r.length!==d.csv.headers.length)throw Error('CSV 행의 형식이 잘못되었습니다.');return r.map(x=>str(x,12000))}),quant:Number.isInteger(d.csv.quant)&&d.csv.quant>=0&&d.csv.quant<d.csv.headers.length?d.csv.quant:-1,qual:Number.isInteger(d.csv.qual)&&d.csv.qual>=0&&d.csv.qual<d.csv.headers.length?d.csv.qual:-1}}return n}
document.addEventListener('input',e=>{let t=e.target;if(t.dataset.field){state.fields[t.dataset.field]=t.type==='checkbox'?t.checked:t.value;t.removeAttribute('aria-invalid');markChanged();if(/^fix(?:Reason)?[12]$/.test(t.dataset.field)){let n=Number(t.dataset.field.slice(-1));revisionBody(n);let pre=document.querySelector('[data-copy="fix'+n+'"]')?.closest('.panel')?.querySelector('pre');if(pre)pre.textContent=promptCache['fix'+n]}if(t.dataset.field==='lastFix'){body('preview');let pre=document.querySelector('[data-copy="lastFix"]')?.closest('.panel')?.querySelector('pre');if(pre)pre.textContent=promptCache.lastFix}}if(t.dataset.survey!==undefined){state.survey[+t.dataset.survey][t.dataset.key]=t.value;markChanged()}if(t.dataset.cut!==undefined){state.cuts[+t.dataset.cut][t.dataset.key]=t.value;state.fields.scriptFinal=false;markChanged()}if(t.dataset.bubble){let b=state.cuts[selectedCut].bubbles[selectedBubble];if(!b)return;b[t.dataset.bubble]=t.dataset.bubble==='text'?t.value:+t.value;b.x=Math.min(b.x,100-b.w);b.y=Math.min(b.y,100-b.h);markChanged();drawEditor()}if(t.dataset.cutSetting){state.cuts[selectedCut][t.dataset.cutSetting]=t.dataset.cutSetting==='fit'?t.value:+t.value;markChanged();drawEditor()}});
document.addEventListener('change',async e=>{let t=e.target;try{if(t.dataset.csv){state.csv[t.dataset.csv]=+t.value;markChanged();render()}if(t.id==='csv-file'||t.id==='encoding'&&csvFile){let f=t.id==='csv-file'?t.files[0]:csvFile;if(!f)return;if(f.size>10*1024*1024)throw Error('CSV 파일은 10MB 이하로 올려주세요.');csvFile=f;let text=new TextDecoder($('#encoding').value).decode(await f.arrayBuffer());if(text.includes('\uFFFD'))throw Error('한글 읽기 방식을 바꾼 뒤 파일을 다시 선택해주세요.');let parsed=parseCSV(text);state.csv={name:f.name,...parsed,quant:-1,qual:-1};await persist();render();toast('응답 파일을 읽었어요. 다음 단계에서 질문을 선택하세요.')}if(t.dataset.upload){let file=t.files[0];if(!file)return;busy(true,'이미지를 저장하고 있어요…');let data=t.dataset.upload.startsWith('webtoon-')?await readWholeImage(file):await readImage(file);if(t.dataset.upload==='practice')state.practiceImage=data;else if(t.dataset.upload==='reference')state.referenceImage=data;else if(t.dataset.upload.startsWith('webtoon-'))state.webtoon[t.dataset.upload.slice(8)]=data;else state.cuts[selectedCut].image=data;await persist();render();toast('이미지를 저장했어요.')}if(t.id==='restore-file'){let f=t.files[0];if(!f)return;if(f.size>120*1024*1024)throw Error('백업 파일은 120MB 이하로 불러올 수 있습니다.');let next=normalizeBackup(JSON.parse(await f.text()));if(Object.keys(state.fields).length&&!confirm('불러온 작업으로 현재 작업실을 바꿀까요? 기존 작업이 필요하면 취소 후 먼저 백업하세요.')){t.value='';return}state=next;imageCache.clear();await persist();render();toast('백업한 작업을 불러왔어요.');t.value=''}}catch(e){toast(e.message||'파일을 읽지 못했습니다.',true)}finally{busy(false)}});
document.addEventListener('click',async e=>{let t=e.target.closest('button,a');if(!t)return;try{if(t.dataset.go){await go(t.dataset.go);return}if(t.dataset.copy){if(['fix1','fix2'].includes(t.dataset.copy))revisionBody(Number(t.dataset.copy.slice(-1)));if(t.dataset.copy==='lastFix')body('preview');await copy(promptCache[t.dataset.copy]);return}if(t.dataset.useTopic){state.fields.tentative=F(t.dataset.useTopic);markChanged();render();return}if(t.dataset.cutSelect!==undefined){selectedCut=+t.dataset.cutSelect;selectedBubble=-1;render();return}if(t.dataset.editCut!==undefined){selectedCut=+t.dataset.editCut;await go('editor');return}if(t.dataset.bubbleSelect!==undefined){selectedBubble=+t.dataset.bubbleSelect;render();return}if(t.dataset.export){await exportWork(t.dataset.export);return}switch(t.dataset.action){case'home':await go('home');break;case'menu':$('#sidebar').classList.toggle('open');break;case'font':state.font=(state.font+1)%3;markChanged();render();break;case'summary':summary();break;case'summary-pdf':await exportSummary();break;case'backup':await backup();break;case'restore':$('#restore-file').click();break;case'new':projectModal();break;case'start':if(state.done.length||Object.keys(state.fields).length){await go(steps.find(s=>!state.done.includes(s.id))?.id||'finish')}else projectModal();break;case'create':{let name=$('#newName').value.trim();if(!name){$('#newName').focus();return}let alias=$('#newAlias').value.trim();state=fresh();state.project={name,alias};closeModal();await go('intro');break}case'close':closeModal();break;case'prev':{let index=steps.findIndex(s=>s.id===state.current);await go(index>0?steps[index-1].id:'home');break}case'next':{let error=required(state.current);if(error){showValidation(error);return}if(!state.done.includes(state.current))state.done.push(state.current);let i=steps.findIndex(s=>s.id===state.current);if(state.current==='insight'&&!F('topic'))state.fields.topic=F('tentative');if(state.current==='preview'&&!F('finalMessage'))state.fields.finalMessage=F('message');if(i===steps.length-1){await persist();render();modal('<h2>나의 8컷 웹툰, 완성!</h2><p>끝까지 확인하고 고친 여러분의 이야기를 응원합니다.</p><p>마지막 수정 내용까지 보관하려면 작업 백업을 한 번 더 내려받으세요.</p><button class="primary" data-action="backup">최종 작업 백업 ↓</button>')}else await go(steps[i+1].id);break}case'parse-script':{let parsed=parseScript(F('rawScript'));if(state.cuts.some(c=>c.scene)&&!confirm('새로 나눈 대본으로 기존 장면 설명과 대사를 바꿀까요? 이미지와 말풍선은 유지되므로 새 대본과 비교해야 합니다.'))return;parsed.forEach((p,i)=>Object.assign(state.cuts[i],p));state.fields.scriptFinal=false;await persist();render();toast('8컷으로 나눴어요. 내용을 확인하세요.');break}case'revision-copy':await copy(`전체 8컷의 구성과 캐릭터 설정은 유지해 줘.\n수정할 내용: ${F('revision')}\n수정 이유: ${F('revisionReason')}\n수정한 컷을 [번호컷], 장면:, 대사:, 필수 요소: 형식으로 보여줘.\n\n현재 대본:\n${scriptText()}`);break;case'reference-download':if(state.referenceImage)download(await(await fetch(state.referenceImage)).blob(),'캐릭터_기준이미지.jpg');break;case'use-dialogue':case'add-bubble':case'add-caption':{let c=state.cuts[selectedCut];if(c.bubbles.length>=12){toast('한 컷에 최대 12개까지 넣을 수 있어요.',true);return}let text=t.dataset.action==='use-dialogue'?c.dialogue:'';if(t.dataset.action==='use-dialogue'&&!text.trim()){toast('대본 카드에 대사를 먼저 입력해주세요.',true);return}c.bubbles.push({type:t.dataset.action==='add-caption'?'caption':'speech',text,x:8,y:65,w:80,h:27,font:26});selectedBubble=c.bubbles.length-1;markChanged();render();break}case'delete-bubble':state.cuts[selectedCut].bubbles.splice(selectedBubble,1);selectedBubble=-1;markChanged();render();break}}catch(e){toast(e.message||'작업 중 문제가 발생했어요.',true)}});
document.addEventListener('pointerdown',e=>{if(e.target.id!=='editor-canvas')return;let rect=e.target.getBoundingClientRect(),x=(e.clientX-rect.left)/rect.width*100,y=(e.clientY-rect.top)/rect.height*100,bs=state.cuts[selectedCut].bubbles,index=-1;for(let i=bs.length-1;i>=0;i--){let b=bs[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){index=i;break}}if(index<0)return;if(selectedBubble!==index){selectedBubble=index;render()}let b=bs[index];drag={dx:x-b.x,dy:y-b.y};$('#editor-canvas')?.setPointerCapture(e.pointerId)});
document.addEventListener('pointermove',e=>{if(!drag)return;let c=$('#editor-canvas');if(!c)return;let r=c.getBoundingClientRect(),b=state.cuts[selectedCut].bubbles[selectedBubble];b.x=Math.max(0,Math.min(100-b.w,(e.clientX-r.left)/r.width*100-drag.dx));b.y=Math.max(0,Math.min(100-b.h,(e.clientY-r.top)/r.height*100-drag.dy));drawEditor()});document.addEventListener('pointerup',()=>{if(drag){drag=null;markChanged();render()}});document.addEventListener('pointercancel',()=>{drag=null});
document.addEventListener('keydown',e=>{if(!$('#modal').hidden){if(e.key==='Escape')closeModal();if(e.key==='Tab'){let a=[...$('#modal').querySelectorAll('button,input,textarea,select,a[href]')].filter(x=>!x.disabled);if(e.shiftKey&&document.activeElement===a[0]){e.preventDefault();a.at(-1)?.focus()}else if(!e.shiftKey&&document.activeElement===a.at(-1)){e.preventDefault();a[0]?.focus()}}}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)persist()});window.addEventListener('beforeunload',()=>persist());
