<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>강사용 빠른 복사</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
    background: #f4f6fb;
    color: #182033;
}
.wrap {
    width: min(920px, calc(100% - 30px));
    margin: 0 auto;
    padding: 40px 0 60px;
}
header { margin-bottom: 24px; }
h1 {
    margin: 0 0 8px;
    font-size: clamp(28px, 4vw, 40px);
    letter-spacing: -0.04em;
}
.subtitle {
    margin: 0;
    color: #697386;
    font-size: 15px;
}
.cards {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
}
.service-card {
    background: #fff;
    border: 1px solid #e7eaf0;
    border-radius: 22px;
    padding: 20px;
    box-shadow: 0 10px 28px rgba(25, 35, 58, .06);
}
.service-card h2 {
    margin: 0 0 15px;
    font-size: 21px;
    letter-spacing: -0.03em;
}
.button-grid {
    display: grid;
    gap: 10px;
}
.action-btn {
    width: 100%;
    border: 0;
    border-radius: 14px;
    padding: 14px 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font: inherit;
    cursor: pointer;
    transition: transform .08s ease, filter .15s ease;
}
.action-btn:hover { filter: brightness(.985); }
.action-btn:active { transform: scale(.985); }
.copy-btn {
    background: #eef2ff;
    color: #303b73;
}
.link-btn {
    background: #eaf8f1;
    color: #176b46;
}
.add-btn {
    background: #fff4df;
    color: #8a5a00;
}
.manage-row {
    display: flex;
    gap: 8px;
}
.custom-copy-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 8px;
}
.custom-copy-row .action-btn {
    min-width: 0;
}
.delete-mini {
    border: 0;
    border-radius: 12px;
    padding: 0 13px;
    background: #fff0f0;
    color: #b42318;
    font: inherit;
    font-weight: 800;
    cursor: pointer;
}
.delete-mini:hover { filter: brightness(.98); }
.label {
    font-weight: 700;
    font-size: 15px;
}
.action {
    font-weight: 800;
    font-size: 14px;
}
.note {
    margin-top: 20px;
    text-align: center;
    color: #8b94a6;
    font-size: 12px;
}
.toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%) translateY(18px);
    background: #172033;
    color: white;
    padding: 11px 16px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: .2s ease;
    font-size: 14px;
    font-weight: 700;
    box-shadow: 0 10px 25px rgba(0,0,0,.18);
}
.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}
@media (max-width: 680px) {
    .cards { grid-template-columns: 1fr; }
    .wrap { width: min(100% - 20px, 920px); padding-top: 26px; }
}

.api-status-box{
    margin-top:10px;padding:12px 14px;border:1px solid #e7eaf0;border-radius:14px;
    background:#f7f9fc;font-size:13px;line-height:1.5
}
.api-status-main{font-weight:800}
.api-status-ok{color:#176b46}
.api-status-lock{color:#8a5a00}
.api-status-sub{margin-top:3px;color:#7b8496;font-size:12px}
.api2-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.secondary-btn{background:#f2f4f7;color:#344054}
.danger-btn{background:#fff0f0;color:#b42318}
@media(max-width:520px){.api2-actions{grid-template-columns:1fr}}

</style>
</head>
<body>
<div class="wrap">

    <p class="subtitle">정보는 숨기고, 필요한 항목만 복사하거나 바로 접속하세요.</p>
</header>
<main class="cards">

    <section class="service-card">
        <h2>키즐콘</h2>
        <div class="button-grid">
            
            <button class="action-btn copy-btn" type="button"

            <button class="action-btn copy-btn" type="button"

            <button class="action-btn link-btn" type="button"

                <span class="action">바로가기 ↗</span>
            </button>
            
        </div>
    </section>
    
    <section class="service-card">
        <h2>n8n</h2>
        <div class="button-grid">
            
            <button class="action-btn copy-btn" type="button"
                    data-copy="aW5zdHJ1Y3RvcjE=" onclick="copyValue(this, 'ID')">
                <span class="label">ID</span>
                <span class="action">복사</span>
            </button>
            
            <button class="action-btn copy-btn" type="button"
                    data-copy="cGxheW44bitpbnN0cnVjdG9yMUBnbWFpbC5jb20=" onclick="copyValue(this, '이메일')">
                <span class="label">이메일</span>
                <span class="action">복사</span>
            </button>
            
            <button class="action-btn copy-btn" type="button"
                    data-copy="U3R1ZGVudDAx" onclick="copyValue(this, 'PW')">
                <span class="label">PW</span>
                <span class="action">복사</span>
            </button>
            
            <button class="action-btn link-btn" type="button"
                    data-url="aHR0cHM6Ly9hcHAubjhuLmNsb3VkL2xvZ2lu" onclick="openLink(this)">
                <span class="label">사이트</span>
                <span class="action">바로가기 ↗</span>
            </button>
            
        </div>
    </section>
    
    <section class="service-card">
        <h2>API</h2>
        <div class="button-grid">
            
            <button class="action-btn copy-btn" type="button"
                    data-copy="c2sta20xZm01MGFBWkotNFdDOEo1WDAwUQ==" onclick="copyValue(this, 'API KEY 1')">
                <span class="label">API KEY 1</span>
                <span class="action">복사</span>
            </button>
            
            
            <button class="action-btn copy-btn" type="button" onclick="copyEncryptedApi2()">

                <button class="action-btn danger-btn" type="button" onclick="clearEncryptedApi2()">

                </button>
            </div>

            <div id="api2Status" class="api-status-box">
                <div id="api2StatusMain" class="api-status-main api-status-lock">확인 중...</div>
                <div id="api2StatusSub" class="api-status-sub"></div>
            </div>

            
        </div>
    </section>
    
    <section class="service-card">
        <h2>내 복사함</h2>
        <div class="button-grid">
            <div id="customCopyList" class="button-grid"></div>
            <button class="action-btn add-btn" type="button" onclick="addCustomCopyItem()">

            </button>
        </div>
    </section>

    <section class="service-card">
        <h2>패들렛</h2>
        <div class="button-grid">
            
            <button class="action-btn link-btn" type="button"
                    data-url="aHR0cHM6Ly9wYWRsZXQuY29tL3llbWUvYWktbjhuLXpzbXZkYjV2cG82aGl5aWk=" onclick="openLink(this)">
                <span class="label">사이트</span>
                <span class="action">바로가기 ↗</span>
            </button>
            
        </div>
    </section>
    
    <section class="service-card">
        <h2>디싹</h2>
        <div class="button-grid">
            
            <button class="action-btn copy-btn" type="button"
                    data-copy="YmViZXRvMDk4N0BnbWFpbC5jb20=" onclick="copyValue(this, 'ID')">
                <span class="label">ID</span>
                <span class="action">복사</span>
            </button>
            
            <button class="action-btn copy-btn" type="button"
                    data-copy="YWE1NzY0MDkwOSEh" onclick="copyValue(this, 'PW')">
                <span class="label">PW</span>
                <span class="action">복사</span>
            </button>
            
            <button class="action-btn link-btn" type="button"
                    data-url="aHR0cHM6Ly9uZXdzYWMua29zYWMucmUua3Iv" onclick="openLink(this)">
                <span class="label">사이트</span>

            </button>
            
        </div>

</main>
<p class="note">실제 ID · 이메일 · 비밀번호 · API KEY · URL은 화면에 표시되지 않습니다. ‘내 복사함’과 API KEY 2에 새로 저장한 값은 이 브라우저에만 저장됩니다.</p>
</div>

<div id="toast" class="toast">복사되었습니다.</div>

<script>

const API2_STORAGE_KEY = "teacher_api2_encrypted_v1";
let __api2SessionKey = null;
let __api2SessionPlain = null;

function bytesToB64(bytes) {
    let binary = "";
    bytes.forEach(b => binary += String.fromCharCode(b));
    return btoa(binary);
}
function b64ToBytes(s) {
    const binary = atob(s);
    return Uint8Array.from(binary, c => c.charCodeAt(0));
}
async function deriveApi2Key(passphrase, salt) {
    const enc = new TextEncoder();
    const baseKey = await crypto.subtle.importKey(
        "raw", enc.encode(passphrase), "PBKDF2", false, ["deriveKey"]
    );
    return crypto.subtle.deriveKey(
        {name:"PBKDF2", salt, iterations:150000, hash:"SHA-256"},
        baseKey,
        {name:"AES-GCM", length:256},
        false,
        ["encrypt","decrypt"]
    );
}
async function encryptApi2(plain, passphrase) {
    const enc = new TextEncoder();
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await deriveApi2Key(passphrase, salt);
    const cipher = new Uint8Array(await crypto.subtle.encrypt(
        {name:"AES-GCM", iv}, key, enc.encode(plain)
    ));
    return {
        v:1,
        salt:bytesToB64(salt),
        iv:bytesToB64(iv),
        cipher:bytesToB64(cipher),
        savedAt:new Date().toISOString()
    };
}
async function decryptApi2(payload, passphrase) {
    const key = await deriveApi2Key(passphrase, b64ToBytes(payload.salt));
    const plainBuf = await crypto.subtle.decrypt(
        {name:"AES-GCM", iv:b64ToBytes(payload.iv)},
        key,
        b64ToBytes(payload.cipher)
    );
    return new TextDecoder().decode(plainBuf);
}
function getEncryptedApi2Payload() {
    try {
        const raw = localStorage.getItem(API2_STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
    } catch(e) {
        return null;
    }
}
function formatSavedAt(iso) {
    try {
        return new Date(iso).toLocaleString("ko-KR");
    } catch(e) {
        return iso || "";
    }
}
function refreshApi2Status() {
    const main = document.getElementById("api2StatusMain");
    const sub = document.getElementById("api2StatusSub");
    if (!main || !sub) return;
    const p = getEncryptedApi2Payload();
    if (!p) {
        main.textContent = "API KEY 2 저장 안 됨";
        main.className = "api-status-main api-status-lock";
        sub.textContent = "‘새 키 저장’을 눌러 이 브라우저에 암호화 저장하세요.";
        return;
    }
    if (__api2SessionPlain) {
        main.textContent = "API KEY 2 저장됨 · 잠금 해제됨 ✅";
        main.className = "api-status-main api-status-ok";
        sub.textContent = "저장일: " + formatSavedAt(p.savedAt) + " · 이 탭을 닫으면 다시 잠깁니다.";
    } else {
        main.textContent = "API KEY 2 저장됨 · 잠김 🔒";
        main.className = "api-status-main api-status-lock";
        sub.textContent = "저장일: " + formatSavedAt(p.savedAt) + " · 복사할 때 비밀번호를 입력하세요.";
    }
}
async function setEncryptedApi2() {
    const apiKey = prompt("새 API KEY 2를 입력하세요.\n키는 HTML 파일에 저장되지 않고 이 브라우저에 암호화되어 저장됩니다.");
    if (!apiKey || !apiKey.trim()) return;

    const pass1 = prompt("API KEY 2를 잠글 비밀번호를 정하세요.\n※ 이 비밀번호는 저장되지 않습니다. 잊으면 키를 다시 저장해야 합니다.");
    if (!pass1) return;
    const pass2 = prompt("잠금 비밀번호를 한 번 더 입력하세요.");
    if (pass1 !== pass2) {
        alert("비밀번호가 서로 다릅니다. 다시 시도해 주세요.");
        return;
    }
    if (pass1.length < 6) {
        if (!confirm("비밀번호가 짧습니다. 그래도 저장할까요?")) return;
    }

    try {
        const payload = await encryptApi2(apiKey.trim(), pass1);
        localStorage.setItem(API2_STORAGE_KEY, JSON.stringify(payload));
        __api2SessionPlain = apiKey.trim();
        showToast("API KEY 2 암호화 저장 완료");
        refreshApi2Status();
    } catch(e) {
        alert("암호화 저장 중 오류가 발생했습니다.");
    }
}
async function copyEncryptedApi2() {
    const payload = getEncryptedApi2Payload();
    if (!payload) {
        alert("먼저 ‘API KEY 2 설정 → 새 키 저장’을 눌러 키를 저장하세요.");
        return;
    }

    let plain = __api2SessionPlain;
    if (!plain) {
        const pass = prompt("API KEY 2 잠금 비밀번호를 입력하세요.");
        if (!pass) return;
        try {
            plain = await decryptApi2(payload, pass);
            __api2SessionPlain = plain;
        } catch(e) {
            alert("비밀번호가 맞지 않거나 저장된 데이터가 손상되었습니다.");
            return;
        }
    }
    await copyPlainText(plain, "API KEY 2");
    refreshApi2Status();
}
function clearEncryptedApi2() {
    if (!getEncryptedApi2Payload()) {
        showToast("삭제할 API KEY 2가 없습니다.");
        return;
    }
    if (!confirm("이 브라우저에 저장된 API KEY 2를 완전히 삭제할까요?")) return;
    localStorage.removeItem(API2_STORAGE_KEY);
    __api2SessionKey = null;
    __api2SessionPlain = null;
    refreshApi2Status();
    showToast("API KEY 2 삭제 완료");
}

function decode(encoded) {
    const binary = atob(encoded);
    const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
    return new TextDecoder("utf-8").decode(bytes);
}

function showToast(message) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(() => toast.classList.remove("show"), 1300);
}

async function copyValue(button, label) {
    const value = decode(button.dataset.copy);
    try {
        await navigator.clipboard.writeText(value);
    } catch (e) {
        const temp = document.createElement("textarea");
        temp.value = value;
        temp.style.position = "fixed";
        temp.style.opacity = "0";
        document.body.appendChild(temp);
        temp.select();
        document.execCommand("copy");
        temp.remove();
    }
    showToast(label + " 복사 완료");
}


async function copyPlainText(value, label) {
    try {
        await navigator.clipboard.writeText(value);
    } catch (e) {
        const temp = document.createElement("textarea");
        temp.value = value;
        temp.style.position = "fixed";
        temp.style.opacity = "0";
        document.body.appendChild(temp);
        temp.select();
        document.execCommand("copy");
        temp.remove();
    }
    showToast(label + " 복사 완료");
}

const CUSTOM_COPY_STORAGE_KEY = "teacher_custom_copy_items";

function getCustomCopyItems() {
    try {
        const saved = JSON.parse(localStorage.getItem(CUSTOM_COPY_STORAGE_KEY) || "[]");
        return Array.isArray(saved) ? saved : [];
    } catch (e) {
        return [];
    }
}

function saveCustomCopyItems(items) {
    localStorage.setItem(CUSTOM_COPY_STORAGE_KEY, JSON.stringify(items));
}

function renderCustomCopyItems() {
    const list = document.getElementById("customCopyList");
    if (!list) return;

    const items = getCustomCopyItems();
    list.innerHTML = "";

    if (items.length === 0) {
        const empty = document.createElement("div");
        empty.style.cssText = "padding:4px 2px 2px;color:#8b94a6;font-size:13px;";
        empty.textContent = "아직 만든 복사 버튼이 없습니다.";
        list.appendChild(empty);
        return;
    }

    items.forEach((item, index) => {
        const row = document.createElement("div");
        row.className = "custom-copy-row";

        const button = document.createElement("button");
        button.className = "action-btn copy-btn";
        button.type = "button";
        button.innerHTML = '<span class="label"></span><span class="action">복사</span>';
        button.querySelector(".label").textContent = item.label;
        button.addEventListener("click", () => copyPlainText(item.value, item.label));
        button.title = "클릭하면 저장된 내용이 복사됩니다.";

        const del = document.createElement("button");
        del.className = "delete-mini";
        del.type = "button";
        del.textContent = "삭제";
        del.title = item.label + " 삭제";
        del.addEventListener("click", () => deleteCustomCopyItem(index));

        row.appendChild(button);
        row.appendChild(del);
        list.appendChild(row);
    });
}

function addCustomCopyItem() {
    const label = prompt("복사 버튼에 표시할 제목을 입력하세요.\n예: 수업 프롬프트, 사이트 코드, 학생 공지");
    if (!label || !label.trim()) return;

    const value = prompt("복사할 내용을 입력하세요.\n이 값은 HTML 파일이 아니라 이 브라우저에만 저장됩니다.");
    if (value === null || !value.trim()) return;

    const items = getCustomCopyItems();
    items.push({
        label: label.trim(),
        value: value.trim()
    });
    saveCustomCopyItems(items);
    renderCustomCopyItems();
    showToast(label.trim() + " 버튼 생성 완료");
}

function deleteCustomCopyItem(index) {
    const items = getCustomCopyItems();
    const item = items[index];
    if (!item) return;
    if (!confirm("'" + item.label + "' 복사 버튼을 삭제할까요?")) return;

    items.splice(index, 1);
    saveCustomCopyItems(items);
    renderCustomCopyItems();
    showToast("삭제 완료");
}


async 

function openLink(button) {
    const url = decode(button.dataset.url);
    window.open(url, "_blank", "noopener,noreferrer");
}

renderCustomCopyItems();

refreshApi2Status();
</script>
