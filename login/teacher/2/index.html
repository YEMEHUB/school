<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; base-uri 'none'; form-action 'none'"><title>교사용 빠른 복사</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#17243b;font:15px/1.5 system-ui,'맑은 고딕',sans-serif}main{max-width:1060px;margin:48px auto;padding:0 24px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:28px;letter-spacing:-1px;margin:0}p{color:#657187;margin:8px 0 24px}.tag{font-size:12px;border:1px solid #cad3df;border-radius:30px;padding:5px 12px;white-space:nowrap}.toolbar{display:flex;gap:10px;margin:24px 0 12px}input{width:100%;padding:14px 16px;border:1px solid #c6d1e0;border-radius:10px;font:inherit;background:white}button,a.open{font:inherit;border:1px solid #cbd5e1;border-radius:7px;background:white;color:#31435f;padding:7px 12px;cursor:pointer;white-space:nowrap;text-decoration:none}button:hover,a.open:hover{background:#edf2fc;border-color:#8fa8d7}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #5a8ce7;outline-offset:2px}.copy{background:#eaf0ff;color:#2453aa;border-color:#d4dffc;font-weight:600}.count{font-size:13px;color:#657187;margin-bottom:18px}section{background:white;border:1px solid #dde3ed;border-radius:12px;margin:14px 0;overflow:hidden}h2{font-size:17px;margin:0;padding:15px 20px;background:#fafbfe;border-bottom:1px solid #e6ebf2;display:flex;align-items:center;justify-content:space-between}.row{display:grid;grid-template-columns:110px minmax(100px,1fr) auto;gap:14px;align-items:center;padding:12px 20px;border-bottom:1px solid #eef1f6}.row:last-child{border:0}.label{color:#69768c;font-size:13px}.value{font:14px/1.5 ui-monospace,Consolas,monospace;overflow-wrap:anywhere}.actions{display:flex;gap:7px}.reveal{font-size:12px;color:#68758b}.note{font-size:12px;color:#768196;margin-top:24px}.empty{text-align:center;padding:45px;color:#748098}#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1d3555;color:white;padding:12px 22px;border-radius:10px;box-shadow:0 8px 30px #1d355533}dialog{border:1px solid #ccd5e3;border-radius:12px;max-width:560px;width:90%;padding:24px}dialog textarea{width:100%;min-height:100px;margin:15px 0;font:14px monospace}dialog::backdrop{background:#17243b66}@media(max-width:600px){main{margin:25px auto;padding:0 14px}h1{font-size:24px}header{align-items:flex-start}.row{grid-template-columns:1fr auto;padding:12px 14px;gap:6px 12px}.label{grid-column:1/-1}.toolbar{flex-wrap:wrap}.toolbar button{margin-left:auto}h2{padding:13px 14px}.tag{display:none}}@media print{body{display:none}}
</style>
<main><header><div><h1>교사용 빠른 복사</h1><p>필요한 계정과 API 설정을 찾아 바로 복사하세요.</p></div><span class="tag">교사 전용 · 오프라인</span></header>
<div class="toolbar"><input id="search" type="search" placeholder="서비스 · 항목 · ID · 이메일 검색" aria-label="계정 검색" autocomplete="off" spellcheck="false"><button id="hide">모두 가리기</button></div><div id="count" class="count" aria-live="polite"></div><div id="list"></div>
<p class="note">비밀번호·API Key는 검색 대상에서 제외됩니다. 표시한 민감정보는 15초 후 또는 창을 벗어나면 다시 가려집니다.<br>화면 가림은 암호화가 아닙니다. 이 파일에는 원본 계정 정보가 포함되어 있으므로 교사용으로 보관하세요. 외부 전송이나 접속 없이 사용할 수 있습니다.</p></main>
<div id="toast" role="status" hidden></div><dialog id="fallback"><h3>직접 복사</h3><p>브라우저에서 자동 복사를 허용하지 않았습니다. 선택된 값을 Ctrl+C로 복사하세요.</p><textarea readonly aria-label="복사할 값"></textarea><button id="close">닫기</button></dialog>
<script>
const DATA=[{"name": "n8n", "fields": [{"label": "사이트 URL", "value": "https://app.n8n.cloud/login", "secret": false}, {"label": "ID", "value": "instructor1", "secret": true}, {"label": "비밀번호", "value": "Student01", "secret": true}, {"label": "이메일", "value": "playn8n+instructor1@gmail.com", "secret": true}]}, {"name": "키즐콘", "fields": [{"label": "사이트 URL", "value": "https://www.kizlcon.com/", "secret": false}, {"label": "ID", "value": "kosac0352@kizling.com", "secret": true}, {"label": "비밀번호", "value": "aa57640909!!", "secret": true}]}, {"name": "디싹", "fields": [{"label": "사이트 URL", "value": "https://newsac.kosac.re.kr/", "secret": false}, {"label": "ID", "value": "bebeto0987@gmail.com", "secret": true}, {"label": "비밀번호", "value": "aa57640909!!", "secret": true}]}, {"name": "공통 API 설정", "fields": [{"label": "API Key", "value": "sk-km1fm50aAZJ-4WC8J5X00Q", "secret": true}, {"label": "Base URL", "value": "http://www.lline-edu-lms.co.kr/v1", "secret": false}]}];
const $=s=>document.querySelector(s);let timers=[],toastTimer;
function hideAll(){timers.forEach(clearTimeout);timers=[];document.querySelectorAll('[data-shown]').forEach(el=>{el.textContent='••••••••';el.removeAttribute('data-shown')});document.querySelectorAll('.reveal').forEach(b=>{b.textContent='보기';b.setAttribute('aria-expanded','false')})}
function toast(s){$('#toast').textContent=s;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,2200)}
async function copy(value,label){let ok=false;try{if(navigator.clipboard){await navigator.clipboard.writeText(value);ok=true}}catch(e){}if(!ok){const t=document.createElement('textarea');t.value=value;t.style.position='fixed';t.style.opacity='0';document.body.append(t);t.select();try{ok=document.execCommand('copy')}catch(e){}t.remove()}if(ok)toast(label+' 복사 완료');else{const d=$('#fallback');d.querySelector('textarea').value=value;d.showModal();d.querySelector('textarea').select()}}
function render(){hideAll();const q=$('#search').value.trim().toLocaleLowerCase(),tokens=q.split(/\s+/).filter(Boolean);const list=$('#list');list.replaceChildren();let total=0;
for(const item of DATA){const hay=[item.name,...item.fields.flatMap(f=>[f.label,...(/비밀번호|API Key/.test(f.label)?[]:[f.value])])].join(' ').toLocaleLowerCase();if(!tokens.every(t=>hay.includes(t)))continue;total++;const sec=document.createElement('section'),h=document.createElement('h2');h.textContent=item.name;const url=item.fields.find(f=>f.label==='사이트 URL');if(url&&/^https?:\/\//i.test(url.value)){const a=document.createElement('a');a.className='open';a.textContent='사이트 열기 ↗';a.href=url.value;a.target='_blank';a.rel='noopener noreferrer';h.append(a)}sec.append(h);
for(const f of item.fields){const row=document.createElement('div');row.className='row';const label=document.createElement('span');label.className='label';label.textContent=f.label;const val=document.createElement('span');val.className='value';val.textContent=f.secret?'••••••••':f.value;const actions=document.createElement('div');actions.className='actions';if(f.secret){const b=document.createElement('button');b.className='reveal';b.textContent='보기';b.setAttribute('aria-label',item.name+' '+f.label+' 보기');b.setAttribute('aria-expanded','false');b.onclick=()=>{if(val.hasAttribute('data-shown')){val.textContent='••••••••';val.removeAttribute('data-shown');b.textContent='보기';b.setAttribute('aria-expanded','false')}else{val.textContent=f.value;val.setAttribute('data-shown','');b.textContent='가리기';b.setAttribute('aria-expanded','true');timers.push(setTimeout(()=>{val.textContent='••••••••';val.removeAttribute('data-shown');b.textContent='보기';b.setAttribute('aria-expanded','false')},15000))}};actions.append(b)}const b=document.createElement('button');b.className='copy';b.textContent='복사';b.setAttribute('aria-label',item.name+' '+f.label+' 복사');b.onclick=()=>copy(f.value,f.label);actions.append(b);row.append(label,val,actions);sec.append(row)}list.append(sec)}$('#count').textContent=total+' / '+DATA.length+'개 그룹';if(!total){const e=document.createElement('div');e.className='empty';e.textContent='검색 결과가 없습니다.';list.append(e)}}
$('#search').addEventListener('input',render);$('#hide').onclick=hideAll;window.addEventListener('blur',hideAll);document.addEventListener('visibilitychange',()=>{if(document.hidden)hideAll()});$('#close').onclick=()=>$('#fallback').close();$('#fallback').addEventListener('close',()=>$('#fallback textarea').value='');document.addEventListener('keydown',e=>{if(e.key==='Escape'){hideAll();$('#search').value='';render()}});render();
</script></html>
