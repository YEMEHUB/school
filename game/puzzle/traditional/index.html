<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>가로세로 낱말퍼즐 - 학과편 (그린)</title>
  <style>
    :root {
      --blue-main: #54007C;
      --blue-dark: #46005F;
      --blue-light: #BC83BD;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

      padding: 0;
      background: #CFA7D3;
      background-image: linear-gradient(180deg, #CFA7D3 0%, #BC83BD 40%, #A1589E 100%);
    }
    .hero {
      padding: 18px 24px 10px;
      background: linear-gradient(90deg, #54007C, #A1589E);
      color: #fff;
      font-size: 22px;
      font-weight: 900;
      text-shadow: 0 2px 4px rgba(0,0,0,0.25);
    }
    .hero-sub {
      padding: 0 24px 14px;
      font-size: 13px;
      color: #F5E4F7;
    }
    .container {
      display: flex;
      gap: 24px;
      align-items: flex-start;
      max-width: 1080px;
      margin: 0 auto;
      padding: 16px;
    }
    .grid-wrapper {
      background: rgba(255, 255, 255, 0.96);
      padding: 14px;
      border-radius: 18px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
      border: 3px solid var(--blue-main);
    }
    table {
      border-collapse: collapse;
      user-select: none;
    }
    td.cell {
      width: 38px;
      height: 38px;
      padding: 4px;
      border: none;
    }
    td.cell.inactive {
      background: transparent;
    }
    td.cell.inactive::before {
      content: "";
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 10px;
      background: var(--blue-light);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.5);
    }
    .tile {
      width: 100%;
      height: 100%;
      border-radius: 12px;
      background: linear-gradient(145deg, #ffffff 0%, #f7fff9 45%, #edf7ee 100%);
      box-shadow:
        0 2px 0 rgba(129,199,132,0.9),
        0 4px 6px rgba(0,0,0,0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border: 1px solid #c8e6c9;
    }
    td.cell.active {
      background: transparent;
      cursor: pointer;
    }
    td.cell.highlight .tile {
      box-shadow:
        0 0 0 3px #ffeb3b,
        0 2px 0 rgba(129,199,132,0.9),
        0 4px 6px rgba(0,0,0,0.25);
    }
    .cell-input {
      width: 80%;
      height: 80%;
      border-radius: 10px;
      border: 2px solid #cfd8dc;
      outline: none;
      background: #ffffff;
      color: #1b2554;
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      caret-color: #54007C;
      box-shadow: inset 0 1px 1px rgba(0,0,0,0.08);
    }
    .sidebar {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .current-clue-box {
      background: rgba(255, 255, 255, 0.97);
      border-radius: 18px;
      padding: 14px 16px;
      box-shadow: 0 8px 18px rgba(0,0,0,0.15);
    }
    .current-clue-title {
      font-weight: 800;
      margin-bottom: 4px;
      font-size: 16px;
      color: #46005F;
    }
    .current-clue-text {
      font-size: 14px;
      line-height: 1.5;
      margin: 4px 0;
      color: #263238;
    }
    .current-answer {
      margin-top: 6px;
      font-size: 14px;
      color: #b71c1c;
      font-weight: 700;
      display: none;
    }
    .current-answer.show {
      display: block;
    }
    .hint-text {
      margin-top: 6px;
      font-size: 12px;
      color: #546e7a;
    }
    .clue-lists-box {
      background: rgba(255, 255, 255, 0.98);
      border-radius: 18px;
      padding: 12px 14px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.15);
      max-height: 420px;
      overflow: auto;
    }
    .clue-lists-box h3 {
      margin: 4px 0 6px;
      font-size: 15px;
      font-weight: 800;
      color: #46005F;
    }
    .clue-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    .clue-button {
      border: none;
      border-radius: 16px;
      padding: 5px 12px;
      font-size: 12px;
      background: #54007C;
      color: #ffffff;
      cursor: pointer;
      transition: transform 0.05s, box-shadow 0.1s, background 0.1s;
      box-shadow: 0 3px 0 #46005F;
    }
    .clue-button:hover {
      background: #388e3c;
      transform: translateY(-1px);
      box-shadow: 0 4px 0 #46005F;
    }
    .clue-button.active {
      background: #a5d6a7;
      color: #46005F;
      box-shadow: 0 3px 0 #81c784;
    }
    .popup-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.35);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .popup-backdrop.show {
      display: flex;
    }
    .popup-inner {
      background: #ffffff;
      border-radius: 18px;
      padding: 18px 20px 16px;
      min-width: 320px;
      max-width: 540px;
      box-shadow: 0 10px 22px rgba(0,0,0,0.35);
      position: relative;
      border: 2px solid var(--blue-main);
    }
    .popup-title {
      font-weight: 800;
      margin-bottom: 6px;
      color: #46005F;
    }
    .popup-text {
      font-size: 14px;
      line-height: 1.5;
      max-height: 150px;
      overflow-y: auto;
      margin-bottom: 10px;
      color: #263238;
    }
    .popup-input-row {
      margin-bottom: 6px;
      font-size: 14px;
    }

      padding: 6px 8px;
      font-size: 14px;
      border-radius: 8px;
      border: 1px solid #c4cfe0;
      margin-top: 4px;
    }
    .popup-hint {
      font-size: 12px;
      color: #546e7a;
    }
    .popup-close {
      position: absolute;
      top: 8px;
      right: 8px;
      border: none;
      background: transparent;
      font-size: 16px;
      cursor: pointer;
      color: #60708a;
    }
    .popup-close:hover {
      color: #000000;
    }

</head>

  const ROWS = 12;
  const COLS = 12;

  const idToClue = {};
  const cellToClues = {};
  let currentClueId = null;

  CLUES.forEach(clue => {
    idToClue[clue.id] = clue;
    const cells = [];
    if (clue.type === "across") {
      for (let col = clue.startCol; col <= clue.endCol; col++) {
        const key = `${clue.startRow}-${col}`;
        cells.push(key);
        (cellToClues[key] ??= []).push(clue.id);
      }
    } else {
      for (let row = clue.startRow; row <= clue.endRow; row++) {
        const key = `${row}-${clue.startCol}`;
        cells.push(key);
        (cellToClues[key] ??= []).push(clue.id);
      }
    }
    clue.cells = cells;
  });

  function buildGrid() {
    const tbody = document.getElementById("puzzle-body");
    for (let row = 1; row <= ROWS; row++) {
      const tr = document.createElement("tr");

      for (let col = 1; col <= COLS; col++) {
        const key = `${row}-${col}`;
        const td = document.createElement("td");
        td.classList.add("cell");
        td.dataset.key = key;

        const active = !!cellToClues[key];
        if (active) {
          td.classList.add("active");

          const tile = document.createElement("div");
          tile.className = "tile";

          const input = document.createElement("input");
          input.type = "text";
          input.maxLength = 1;
          input.className = "cell-input";
          input.autocomplete = "off";

          tile.appendChild(input);
          td.appendChild(tile);

          td.addEventListener("click", () => openClueFromCell(key));
          td.addEventListener("contextmenu", e => {
            e.preventDefault();
            openClueFromCell(key);
            revealCurrentAnswer();
          });
        } else {
          td.classList.add("inactive");
        }

        tr.appendChild(td);
      }

      tbody.appendChild(tr);
    }
  }

  function buildClueLists() {
    const acrossList = document.getElementById("across-list");
    const downList = document.getElementById("down-list");

    CLUES.filter(c => c.type === "across").forEach(clue => {
      const btn = document.createElement("button");
      btn.className = "clue-button";
      const labelNo = clue.no ?? clue.id;
      btn.textContent = `가로 ${labelNo}번 문제`;
      btn.dataset.id = clue.id;
      btn.addEventListener("click", () => openClue(clue.id));
      btn.addEventListener("contextmenu", e => {
        e.preventDefault();
        openClue(clue.id);
        revealCurrentAnswer();
      });
      acrossList.appendChild(btn);
    });

    CLUES.filter(c => c.type === "down").forEach(clue => {
      const btn = document.createElement("button");
      btn.className = "clue-button";
      const labelNo = clue.no ?? clue.id;
      btn.textContent = `세로 ${labelNo}번 문제`;
      btn.dataset.id = clue.id;
      btn.addEventListener("click", () => openClue(clue.id));
      btn.addEventListener("contextmenu", e => {
        e.preventDefault();
        openClue(clue.id);
        revealCurrentAnswer();
      });
      downList.appendChild(btn);
    });
  }

  function openClue(id) {
    const clue = idToClue[id];
    if (!clue) return;
    currentClueId = id;

    document
      .querySelectorAll(".clue-button")
      .forEach(btn => {
        if (btn.dataset.id === String(id)) btn.classList.add("active");
        else btn.classList.remove("active");
      });

    document
      .querySelectorAll("td.cell.highlight")
      .forEach(td => td.classList.remove("highlight"));

    clue.cells.forEach(key => {
      const td = document.querySelector(`td[data-key='${key}']`);
      if (td) td.classList.add("highlight");
    });

    const title = document.getElementById("current-clue-title");
    const text = document.getElementById("current-clue-text");
    const ans = document.getElementById("current-answer-text");

    const labelNo = clue.no ?? clue.id;
    const dirText = clue.type === "across" ? "가로" : "세로";

    title.textContent = `${dirText} ${labelNo}번 문제`;
    text.textContent = clue.question;
    ans.textContent = "";
    ans.classList.remove("show");

    const popup = document.getElementById("popup");
    const pTitle = document.getElementById("popup-clue-title");
    const pText = document.getElementById("popup-clue-text");
    const pInput = document.getElementById("popup-answer-input");

    pTitle.textContent = `${dirText} ${labelNo}번 문제`;
    pText.textContent = clue.question;
    pInput.value = "";
    const length = clue.answer ? Array.from(clue.answer).length : (clue.len || 0);
    pInput.placeholder = length ? `${length} 글자` : "";
    popup.classList.add("show");
    pInput.focus();
  }

  function openClueFromCell(key) {
    const ids = cellToClues[key];
    if (!ids || ids.length === 0) return;
    let chosen = ids[0];
    const acrossId = ids.find(id => idToClue[id].type === "across");
    if (acrossId) chosen = acrossId;
    openClue(chosen);
  }

  function revealCurrentAnswer() {
    if (!currentClueId) return;
    const clue = idToClue[currentClueId];
    const chars = Array.from(clue.answer || "");

    clue.cells.forEach((key, idx) => {
      const td = document.querySelector(`td[data-key='${key}']`);
      if (!td) return;
      const input = td.querySelector("input");
      if (input) {
        input.value = chars[idx] || "";
      }
    });

    if (clue.answer) {
      const ans = document.getElementById("current-answer-text");
      ans.textContent = `정답: ${clue.answer}`;
      ans.classList.add("show");
      const pInput = document.getElementById("popup-answer-input");
      if (pInput) pInput.value = clue.answer;
    }
  }

  document.getElementById("popup-close").addEventListener("click", () => {
    document.getElementById("popup").classList.remove("show");
  });

  document.getElementById("popup").addEventListener("click", e => {
    if (e.target.id === "popup") {
      document.getElementById("popup").classList.remove("show");
    }
  });

  document.getElementById("popup-inner").addEventListener("contextmenu", e => {
    e.preventDefault();
    revealCurrentAnswer();
  });

  buildGrid();
  buildClueLists();
</script>
</body>
</html>
