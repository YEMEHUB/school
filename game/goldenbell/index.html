<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>도전! 골든벨 · 고교학점제</title>
<style>
:root{color-scheme:dark;--bg:#100d24;--panel:#201a39;--text:#fff9ed;--muted:#c4bada;--gold:#ffdc81;--edge:#ffffff22;font-family:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 76% 31%,#2b1d50 0,transparent 48%),var(--bg);color:var(--text)}button{font:inherit;cursor:pointer;color:inherit;border:0}button:focus-visible,a:focus-visible{outline:3px solid #efb7ff;outline-offset:4px}[hidden]{display:none!important}
.shell{max-width:1440px;margin:auto;padding:0 clamp(18px,5vw,72px);min-height:100svh;display:flex;flex-direction:column}
header{min-height:84px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--edge)}.brand{font-size:1rem;font-weight:850;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}.brand b{color:var(--gold);font-size:1.4rem}.tools,.buttons{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.quiet,.primary{border-radius:10px;padding:12px 17px;min-height:46px;font-weight:750}.quiet{background:#ffffff0b;border:1px solid var(--edge)}.quiet:hover{background:#ffffff1c}.primary{background:var(--gold);color:#25182a;border:1px solid var(--gold);box-shadow:0 4px 0 #ab733d}.primary:hover{background:#ffe6a8}.primary:active{transform:translateY(2px);box-shadow:0 2px 0 #ab733d}
main{flex:1;display:grid;align-items:center;padding:32px 0}.screen{animation:enter .35s ease-out both}@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.hero{display:grid;grid-template-columns:1fr 1.04fr;align-items:center;gap:22px}.eyebrow{margin:0 0 14px;text-transform:uppercase;letter-spacing:.16em;color:var(--gold);font-size:.875rem;font-weight:850}.hero h1,.finish h1{margin:0;font-size:clamp(58px,8.3vw,128px);line-height:1;letter-spacing:-.09em;font-weight:950}.hero h1 span{display:block;color:var(--gold);margin-top:9px;text-shadow:0 4px 0 #6d4353}.subtitle{font-size:clamp(21px,2.4vw,36px);margin:24px 0 8px;font-weight:800;letter-spacing:-.045em}.intro{color:var(--muted);margin:0 0 26px;font-size:1.04rem;line-height:1.65}
.stage{position:relative;isolation:isolate;aspect-ratio:1.03;display:grid;place-items:center;min-width:0;container-type:inline-size;background:radial-gradient(circle,#9568e438 0,transparent 67%)}.stage:before,.stage:after{content:"";position:absolute;inset:14%;border:1px solid #c5a1ff44;border-radius:50%;transform:rotate(-24deg) scaleY(.67);z-index:-1}.stage:after{inset:6%;border-style:dashed;transform:rotate(24deg) scaleY(.76)}.star{position:absolute;color:#fee5a1;text-shadow:0 0 18px #f1a851;line-height:1;font-size:8cqw}.star:nth-child(1){left:15%;top:20%}.star:nth-child(2){right:12%;top:23%;font-size:12cqw}.star:nth-child(3){left:10%;bottom:23%;font-size:5cqw}.star:nth-child(4){right:14%;bottom:17%;font-size:6cqw}.star:nth-child(5){left:42%;bottom:10%;font-size:4cqw}
.bell{position:relative;width:61%;height:67%;transform:rotate(-15deg);filter:drop-shadow(0 20px 18px #0b052b90);animation:float 5s ease-in-out infinite}.bell i{position:absolute;display:block}.loop{left:40%;top:2%;width:20%;height:22%;border:clamp(5px,1.4vw,15px) solid #ffdb79;border-radius:50%;box-shadow:inset 0 0 0 3px #a55b24,0 2px 0 #d27824}.cap{left:16%;top:17%;width:68%;height:65%;border-radius:54% 54% 28% 28%/65% 65% 10% 10%;background:linear-gradient(105deg,#d87820,#f9a936 16%,#ffe981 34%,#fff4ae 43%,#ffd55b 54%,#eb972b 76%,#ad501b);box-shadow:inset 0 4px 2px #fff4bf,inset 0 -10px 16px #9f471944}.rim{left:3%;top:70%;width:94%;height:17%;border-radius:80px;background:linear-gradient(#fff0a3,#ffc652 45%,#df8a28 76%,#9d461b);box-shadow:0 4px 0 #853e22,inset 0 2px 0 #fff7c7}.clapper{left:39%;top:82%;width:22%;height:16%;border-radius:0 0 70px 70px;background:linear-gradient(95deg,#a85122,#ffc451 48%,#e08625);box-shadow:inset 0 -3px 1px #a75520}@keyframes float{50%{transform:translateY(-10px) rotate(-10deg)}}
.quiz{width:min(100%,1040px);margin:auto}.steps{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin:0 0 23px}.steps i{height:5px;border-radius:8px;background:#ffffff22}.steps i.done{background:var(--gold)}.steps i.current{background:#c9a6ff}.quiz h1{margin:0 0 22px;font-size:clamp(26px,4.25vw,61px);line-height:1.3;letter-spacing:-.055em;word-break:keep-all;overflow-wrap:anywhere}
.choices{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.choices li{min-height:84px;border:1px solid #fff2;background:#ffffff09;border-radius:14px;padding:14px;display:flex;align-items:center;gap:14px;font-size:clamp(17px,2vw,29px);line-height:1.4;font-weight:690;word-break:keep-all;overflow-wrap:anywhere}.letter{flex:none;display:grid;place-items:center;width:1.95em;height:1.95em;background:#ffffff12;border:1px solid #ffffff20;border-radius:9px;font-weight:850;color:#e9d3ff}
.answer{background:linear-gradient(130deg,#312448,#211a37);border:1px solid #ffdc8159;border-radius:20px;padding:clamp(19px,3.3vw,46px);box-shadow:0 18px 54px #07041442}.answer-title{display:flex;align-items:center;gap:16px;color:var(--gold);font-size:clamp(24px,4.3vw,56px);font-weight:900;line-height:1.26;letter-spacing:-.055em;word-break:keep-all;overflow-wrap:anywhere}.answer-title .letter{background:var(--gold);color:#2a1c33}.explain{font-size:clamp(18px,2.7vw,34px);margin:19px 0 0;color:#f2e9fc;line-height:1.55;letter-spacing:-.032em;word-break:keep-all;overflow-wrap:anywhere}.source{display:inline-block;margin-top:17px;color:var(--muted);text-underline-offset:4px;font-size:.875rem}.quiz-nav{margin-top:22px;display:flex;justify-content:space-between;gap:10px;align-items:center}.finish{text-align:center}.finish h1{font-size:clamp(36px,7vw,92px);line-height:1.14}.finish .stage{width:min(240px,55vw);margin:0 auto}.finish .buttons{justify-content:center;margin-top:24px}
footer{min-height:51px;border-top:1px solid var(--edge);display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:.875rem}kbd{font:inherit;color:var(--text)}
@media(max-width:680px){header{min-height:66px}.tools{gap:5px}.quiet,.primary{padding:9px 11px}.brand{font-size:.9rem}.tools button{font-size:.82rem}.hero{grid-template-columns:1fr;gap:10px}.hero .stage{grid-row:1;width:min(66vw,300px);margin:auto;aspect-ratio:1.25}.hero h1 span{display:inline;margin:0}.hero h1{font-size:clamp(40px,11vw,70px)}main{padding:22px 0}.subtitle{margin:16px 0 5px}.intro{margin-bottom:18px}.choices{grid-template-columns:1fr;gap:8px}.choices li{min-height:55px;padding:9px 11px}.steps{margin-bottom:15px}.quiz h1{margin-bottom:16px}.quiz-nav{margin-top:18px}footer{font-size:.77rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
</style>
</head>
<body>
<div class="shell">
<header>
  <div class="brand"><b aria-hidden="true">✦</b> 고교학점제 골든벨</div>
  <div class="tools">
    <button type="button" class="quiet" id="sound" aria-pressed="true">소리 켜짐</button>
    <button type="button" class="quiet" id="fullscreen">전체 화면</button>
  </div>
</header>
<main id="main"></main>
<footer><span id="hint">첫 화면에서 오프닝 음악을 재생할 수 있어요.</span><span><kbd>←</kbd> 이전 · <kbd>→</kbd> 진행</span></footer>
</div>
<template id="art"><div class="stage" aria-hidden="true"><span class="star">✦</span><span class="star">✧</span><span class="star">✦</span><span class="star">✧</span><span class="star">✦</span><div class="bell"><i class="loop"></i><i class="clapper"></i><i class="cap"></i><i class="rim"></i></div></div></template>
<script>
const source = 'https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=340&boardSeq=105581&lev=0';
const items = [
  {
    question: '고교학점제의 핵심 취지는 무엇일까요?',
    choices: ['모든 학생이 같은 과목을 공부하도록 한다', '학생이 진로와 적성에 맞는 과목을 선택해 이수하도록 한다', '학교에서만 공부하게 한다', '수업 시간을 줄인다'],
    key: 1,
    explanation: '학생이 자신의 진로와 적성에 맞는 과목을 선택하고, 이수 기준을 충족한 과목의 학점을 쌓아 졸업하는 제도예요.'
  },
  {
    question: '2026학년도 고1·2의 공통과목 학점 이수 기준은 무엇일까요?',
    choices: ['모든 과목에서 80점 이상 받기', '과목 출석률 3분의 2 이상만 충족하기', '과목 출석률 3분의 2 이상과 학업성취율 40% 이상 충족하기', '동아리 활동에서 최고 점수 받기'],
    key: 2,
    explanation: '공통과목은 과목 출석률 3분의 2 이상과 학업성취율 40% 이상이 기준이에요. 선택과목의 이수 기준은 과목 출석률 3분의 2 이상이에요.',
    source
  },
  {
    question: '고교학점제의 운영 방향과 거리가 먼 것은 무엇일까요?',
    choices: ['과목 선택권 확대', '진로 맞춤형 교육', '학생이 이수 기준에 도달하도록 학습 지원', '전 과목의 절대평가 폐지'],
    key: 3,
    explanation: '고교학점제는 학생의 과목 선택 폭을 넓히고, 과목을 이수할 수 있도록 학습을 지원하는 제도예요.'
  },
  {
    question: '고교학점제에서 학생의 과목 선택이 중요한 이유는 무엇일까요?',
    choices: ['성적을 올리기 위해', '친구들과 같은 수업을 듣기 위해', '자신의 진로와 연결된 학습을 할 수 있기 때문에', '선생님이 과목을 정해 주기 때문에'],
    key: 2,
    explanation: '관심 있는 진로와 관련된 과목을 배워 보면, 어떤 분야가 나에게 맞는지 살펴보고 다음 학습을 계획할 수 있어요.'
  },
  {
    question: '학교에서 학생의 과목 선택을 돕는 지원은 무엇일까요?',
    choices: ['진로 상담 및 과목 선택 상담', '점심시간 종례', '체육대회', '방과후 청소'],
    key: 0,
    explanation: '진로 상담과 과목 선택 상담을 통해 자신의 관심사를 살펴보고 어떤 과목을 들으면 좋을지 알아볼 수 있어요.'
  },
  {
    question: '2026학년도 고1·2가 공통과목의 학업성취율 기준에 미달하면 어떤 지원을 받을 수 있을까요?',
    choices: ['최소 성취수준 보장지도', '자동으로 이수 처리', '다른 학교로 전학', '수업 면제'],
    key: 0,
    explanation: '최소 성취수준 보장지도는 수업에서 부족했던 부분을 보충하는 학습 지원이에요. 공통과목의 학업성취율 기준에 미달한 학생은 이 지도를 이수해 학점을 취득할 수 있어요.',
    source
  },
  {
    question: '학교는 학생의 과목 선택 폭을 넓히기 위해 어떻게 운영할까요?',
    choices: ['공통과목만 운영한다', '선택과목을 다양하게 개설한다', '모든 학교가 똑같은 과목만 개설한다', '한 교과 중심으로만 수업한다'],
    key: 1,
    explanation: '학교는 융합 선택 과목 등 다양한 선택과목을 개설해 학생들이 관심과 진로에 맞는 과목을 고를 수 있도록 해요.'
  }
];

const main = document.querySelector('#main');
const hint = document.querySelector('#hint');
const art = document.querySelector('#art').innerHTML;
const soundButton = document.querySelector('#sound');
const fullscreen = document.querySelector('#fullscreen');
const letters = 'ABCD';
let page = 0;
let soundEnabled = true;
let audioContext, mix, endTimer;
let playingIntro = false;

function note(destination, pitch, time, duration, volume, timbre = 'triangle') {
  const oscillator = audioContext.createOscillator();
  const envelope = audioContext.createGain();
  oscillator.type = timbre;
  oscillator.frequency.value = 440 * 2 ** ((pitch - 69) / 12);
  envelope.gain.setValueAtTime(.001, time);
  envelope.gain.exponentialRampToValueAtTime(volume, time + .018);
  envelope.gain.exponentialRampToValueAtTime(.001, time + duration);
  oscillator.connect(envelope).connect(destination);
  oscillator.start(time);
  oscillator.stop(time + duration + .03);
}
function stopMusic() {
  if (mix) mix.disconnect();
  mix = null;
  clearTimeout(endTimer);
  playingIntro = false;
  updateMusicButton();
}
function updateMusicButton() {
  const button = document.querySelector('#music');
  if (button) {
    button.textContent = playingIntro ? '음악 정지' : '오프닝 음악 재생';
    button.setAttribute('aria-pressed', String(playingIntro));
  }
}
function play(kind) {
  stopMusic();
  if (!soundEnabled) return;
  const Audio = window.AudioContext || window.webkitAudioContext;
  if (!Audio) {
    hint.textContent = '이 브라우저에서는 소리를 재생할 수 없어요.';
    return;
  }
  try {
    audioContext ||= new Audio();
    audioContext.resume().catch(() => {
      stopMusic();
      hint.textContent = '소리를 재생할 수 없어요. 버튼을 다시 눌러 주세요.';
    });
    mix = audioContext.createGain();
    mix.gain.value = .65;
    mix.connect(audioContext.destination);
    const start = audioContext.currentTime + .05;
    if (kind === 'intro') {
      playingIntro = true;
      const beat = .28;
      const melody = [[0,67],[.5,72],[1,76],[2,79],[2.75,76],[3.5,81],[4,79],[5,76],[6,74],[6.5,77],[7,81],[8,84],[9.5,81],[10,79],[11,77],[12,76],[12.5,79],[13,84],[14,86],[15,84],[16,88],[17,84]];
      const chords = [[48,55,64],[45,52,60],[41,48,57],[43,50,59],[48,55,64]];
      melody.forEach(([step,pitch]) => {
        note(mix,pitch,start+step*beat,step===17?1.35:.36,.22);
        note(mix,pitch+12,start+step*beat,.22,.035,'sine');
      });
      chords.forEach((chord,bar) => {
        const time = start + bar * 4 * beat;
        chord.forEach((pitch,i) => note(mix,pitch,time+i*.025,.78,.1,'sine'));
        note(mix,chord[0],time + 2*beat,.25,.15);
      });
      endTimer = setTimeout(stopMusic, 6300);
    } else {
      const pitches = kind === 'finish' ? [72,76,79,84] : [76,83];
      pitches.forEach((pitch,i) => {
        note(mix,pitch,start+i*.12,.68,.2,'sine');
        note(mix,pitch+12,start+i*.12,.29,.05,'sine');
      });
      endTimer = setTimeout(stopMusic, 1200);
    }
    updateMusicButton();
  } catch {
    stopMusic();
    hint.textContent = '이 브라우저에서는 소리를 재생할 수 없어요.';
  }
}

const end = items.length * 2 + 1;
function render(focus = true) {
  if (page === 0) {
    hint.textContent = '첫 화면에서 오프닝 음악을 재생할 수 있어요.';
    main.innerHTML = '<section class="screen hero"><div><p class="eyebrow">교실 골든벨</p><h1 tabindex="-1">도전! <span>골든벨</span></h1><p class="subtitle">고교학점제 퀴즈</p><p class="intro">일곱 문제에 도전해 보세요.</p><div class="buttons"><button class="primary" data-go="next">퀴즈 시작</button><button class="quiet" id="music" aria-pressed="false">오프닝 음악 재생</button></div></div>'+art+'</section>';
    document.querySelector('#music').onclick = () => {
      if (playingIntro) stopMusic();
      else {
        soundEnabled = true;
        syncSound();
        play('intro');
      }
    };
    updateMusicButton();
  } else if (page === end) {
    hint.textContent = '다시 시작을 누르면 첫 화면으로 돌아가요.';
    main.innerHTML = '<section class="screen finish">'+art+'<p class="eyebrow">7문항 완료</p><h1 tabindex="-1">골든벨 도전 완료!</h1><div class="buttons"><button class="quiet" data-go="back">마지막 해설</button><button class="primary" data-go="home">다시 시작</button></div></section>';
  } else {
    const index = Math.floor((page-1)/2);
    const item = items[index];
    const answer = page % 2 === 0;
    hint.textContent = answer ? '해설을 읽고 다음 화면으로 넘어가세요.' : '답을 골랐다면 정답 공개를 눌러 주세요.';
    const progress = items.map((_,i) => '<i class="'+(i===index?'current':i<index?'done':'')+'"></i>').join('');
    const content = answer
      ? '<div class="answer"><div class="answer-title"><span class="letter">'+letters[item.key]+'</span><span>'+item.choices[item.key]+'</span></div><p class="explain">'+item.explanation+'</p>'+(item.source ? '<a class="source" href="'+item.source+'" target="_blank" rel="noopener">교육부 안내 보기</a>' : '')+'</div>'
      : '<ol class="choices" aria-label="선택지">'+item.choices.map((choice,i) => '<li><span class="letter">'+letters[i]+'</span>'+choice+'</li>').join('')+'</ol>';
    main.innerHTML = '<section class="screen quiz"><div class="steps" aria-hidden="true">'+progress+'</div><p class="eyebrow">'+(index+1)+' / '+items.length+' · '+(answer?'정답 및 해설':'객관식')+'</p><h1 tabindex="-1">'+(answer?'정답은?':item.question)+'</h1>'+content+'<nav class="quiz-nav" aria-label="퀴즈 진행"><button class="quiet" data-go="back">'+(answer?'문제 다시 보기':index===0?'첫 화면':'이전 화면')+'</button><button class="primary" data-go="next">'+(answer?(index===items.length-1?'퀴즈 마치기':'다음 문제'):'정답 공개')+'</button></nav></section>';
  }
  if (focus) main.querySelector('h1').focus({preventScroll:true});
}
function go(action) {
  const next = action === 'home' ? 0 : page + (action === 'next' ? 1 : -1);
  if (next < 0 || next > end || next === page) return;
  stopMusic();
  page = next;
  render();
  if (action === 'next') {
    if (page === end) play('finish');
    else if (page % 2 === 0) play('answer');
  }
}
function syncSound() {
  soundButton.textContent = soundEnabled ? '소리 켜짐' : '소리 꺼짐';
  soundButton.setAttribute('aria-pressed', String(soundEnabled));
}
soundButton.onclick = () => {
  soundEnabled = !soundEnabled;
  if (!soundEnabled) stopMusic();
  syncSound();
};
fullscreen.hidden = !document.fullscreenEnabled;
fullscreen.onclick = async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  } catch {
    hint.textContent = '전체 화면을 사용할 수 없어요. PC에서는 F11 키로 전환할 수 있어요.';
  }
};
document.addEventListener('fullscreenchange', () => {
  fullscreen.textContent = document.fullscreenElement ? '전체 화면 종료' : '전체 화면';
});
main.addEventListener('click', event => {
  const action = event.target.closest('[data-go]')?.dataset.go;
  if (action) go(action);
});
document.addEventListener('keydown', event => {
  if (event.repeat || event.altKey || event.ctrlKey || event.metaKey) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    go(event.key === 'ArrowRight' ? 'next' : 'back');
  }
});
render(false);
</script>
</body>
</html>
