<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>몸으로 말해요 챌린지</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap');
  :root{--ink:#171717;--gold:#ffd95a;--red:#ff5757;--blue:#4d7cff;--green:#42d875;--stone:#6f7785;--leaf:#42b75d}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;overflow:hidden;color:var(--ink);font-family:'Jua',system-ui,sans-serif;background:linear-gradient(90deg,rgba(255,255,255,.11) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.11) 1px,transparent 1px),linear-gradient(180deg,#7bd3ff 0%,#b9ecff 52%,#5bc965 52%,#399947 100%);background-size:34px 34px,34px 34px,100% 100%}
  button{font-family:inherit;cursor:pointer;border:none}
  .app{width:100%;height:100%;padding:clamp(14px,2vw,28px);display:flex;align-items:center;justify-content:center}
  .screen{width:min(1180px,100%);height:min(760px,calc(100vh - clamp(28px,4vw,56px)));min-height:0;display:none;animation:pop .18s ease-out}
  .screen.active{display:flex}
  @keyframes pop{from{transform:scale(.98);opacity:.4}to{transform:scale(1);opacity:1}}
  .panel{width:100%;height:100%;border:6px solid #111;box-shadow:0 14px 0 #111,0 22px 28px rgba(0,0,0,.25);background:#f7e3b4;position:relative;overflow:hidden}
  .panel:before{content:"";position:absolute;inset:0;opacity:.16;background:linear-gradient(90deg,#000 1px,transparent 1px),linear-gradient(#000 1px,transparent 1px);background-size:28px 28px;pointer-events:none}
  .content{position:relative;z-index:1;height:100%;padding:clamp(18px,3vw,42px);display:flex;flex-direction:column}
  .title-box{align-self:center;width:min(760px,96%);background:#2f2f2f;color:white;border:6px solid #111;box-shadow:10px 10px 0 #111;padding:clamp(12px,2vw,22px);text-align:center;margin-bottom:clamp(14px,2vw,24px)}
  .main-title{font-family:'Black Han Sans',sans-serif;font-size:clamp(38px,6vw,78px);line-height:1;letter-spacing:1px;text-shadow:0 6px 0 #000}
  .sub-title{margin-top:10px;font-size:clamp(18px,2.4vw,30px);color:var(--gold)}
  .menu-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(12px,2vw,22px);flex:1;align-content:center}
  .pixel-card,.pixel-button{border:5px solid #111;box-shadow:8px 8px 0 #111;background:var(--gold);color:#111;transition:.08s;text-align:center}
  .pixel-card:hover,.pixel-button:hover{transform:translate(-2px,-2px);box-shadow:10px 10px 0 #111}
  .pixel-card:active,.pixel-button:active{transform:translate(7px,7px);box-shadow:1px 1px 0 #111}
  .pixel-card{min-height:132px;padding:14px 10px;display:flex;flex-direction:column;justify-content:center;gap:6px}
  .card-icon{font-size:clamp(38px,5vw,70px);line-height:1}
  .card-name{font-size:clamp(24px,3vw,38px)}
  .card-count{font-size:clamp(15px,1.7vw,20px);color:#333}
  .pixel-button{padding:clamp(16px,2.2vw,26px);font-size:clamp(26px,4vw,48px);font-family:'Black Han Sans',sans-serif}
  .bottom-row{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:clamp(12px,2vw,22px)}
  .start-button{background:var(--red);color:white;text-shadow:0 4px 0 #8d1a1a}
  .option-button{background:var(--leaf);color:white;text-shadow:0 4px 0 #12682b}
  .back-button{background:var(--stone);color:white;font-size:clamp(20px,2.4vw,30px);padding:14px 18px;align-self:flex-start}
  .select-title{text-align:center;font-family:'Black Han Sans',sans-serif;font-size:clamp(38px,6vw,76px);margin:8px 0 28px;text-shadow:0 5px 0 rgba(0,0,0,.18)}
  .time-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,2vw,24px);margin:auto 0}
  .time-button{background:var(--blue);color:white;min-height:220px;display:flex;flex-direction:column;justify-content:center;gap:10px;text-shadow:0 5px 0 #163385}
  .time-button strong{font-size:clamp(48px,7vw,96px)}
  .time-button span{font-size:clamp(20px,2.4vw,32px)}
  #gameScreen .panel{background:#111a2e;color:white}
  #gameScreen .panel:before{opacity:.08;background-size:30px 30px;background-image:linear-gradient(90deg,#fff 1px,transparent 1px),linear-gradient(#fff 1px,transparent 1px)}
  .hud{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;background:#25395f;border:5px solid #111;box-shadow:0 9px 0 #050915;padding:clamp(10px,1.8vw,18px);font-size:clamp(20px,2.6vw,34px)}
  .hud-left{text-align:left}.hud-center{background:#111;border:4px solid #fff;padding:8px 18px;color:var(--gold);font-family:'Black Han Sans',sans-serif;font-size:clamp(26px,4.2vw,54px)}.hud-right{text-align:right}
  .question-area{flex:1;margin:clamp(22px,3vw,38px) 0;display:flex;align-items:center;justify-content:center;border:7px solid #fff;box-shadow:0 12px 0 rgba(255,255,255,.2);background:radial-gradient(circle at center,rgba(255,255,255,.14),transparent 55%),linear-gradient(135deg,#263b66,#121b31);min-height:0;padding:clamp(28px,5vw,76px);overflow:hidden}
  .question-word{font-family:'Black Han Sans',sans-serif;font-size:clamp(56px,8.5vw,128px);line-height:1.08;text-align:center;letter-spacing:1px;text-shadow:0 7px 0 #000;word-break:keep-all;max-width:100%;overflow-wrap:break-word}
  .question-word.long{font-size:clamp(36px,5.2vw,78px);line-height:1.18;text-shadow:0 5px 0 #000}.question-word.very-long{font-size:clamp(28px,4vw,58px);line-height:1.22;text-shadow:0 4px 0 #000}.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(14px,2.4vw,28px)}
  .action-button{color:white;min-height:clamp(110px,17vh,160px);font-size:clamp(32px,5vw,70px);font-family:'Black Han Sans',sans-serif;border:6px solid #fff;box-shadow:0 10px 0 rgba(0,0,0,.58);text-shadow:0 5px 0 rgba(0,0,0,.35)}
  .pass-button{background:var(--red)}.correct-button{background:var(--green);color:#10220f;text-shadow:0 4px 0 rgba(255,255,255,.35)}
  .mini-note{text-align:center;color:rgba(255,255,255,.72);font-size:clamp(15px,1.5vw,20px);margin-top:14px}
  .result-card{margin:auto;width:min(720px,100%);max-height:100%;border:6px solid #111;box-shadow:10px 10px 0 #111;background:#fff8d8;padding:clamp(18px,3vw,34px);text-align:center;overflow:hidden}
  .result-title{font-family:'Black Han Sans',sans-serif;font-size:clamp(38px,6vw,72px);line-height:1.05}
  .score{margin:14px 0 6px;font-family:'Black Han Sans',sans-serif;font-size:clamp(58px,9vw,108px);color:#e54343;text-shadow:0 5px 0 #111}
  .result-info{font-size:clamp(20px,2.5vw,30px);margin:10px 0 18px}
  .badge{display:inline-block;background:#111;color:var(--gold);border:4px solid var(--gold);padding:8px 18px;font-size:clamp(18px,2.2vw,28px);margin-bottom:12px}
  @media(max-width:900px){body{overflow:auto}.app{min-height:100%;height:auto}.screen{height:auto;min-height:calc(100vh - 28px)}.menu-grid{grid-template-columns:repeat(2,1fr)}.time-grid{grid-template-columns:1fr}.time-button{min-height:130px}.hud{grid-template-columns:1fr;text-align:center}.hud-left,.hud-right{text-align:center}.question-area{min-height:320px}}
  @media(max-width:520px){.app{padding:10px}.content{padding:16px}.panel{border-width:4px;box-shadow:0 9px 0 #111}.title-box{border-width:4px;box-shadow:6px 6px 0 #111}.menu-grid{gap:10px}.pixel-card{min-height:122px;border-width:4px;box-shadow:5px 5px 0 #111}.bottom-row{grid-template-columns:1fr}.question-word{font-size:clamp(58px,18vw,110px)}}

  @media(max-height:760px) and (min-width:901px){
    .app{padding:12px}
    .screen{height:calc(100vh - 24px)}
    .content{padding:22px 34px}
    .title-box{margin-bottom:18px}
    .pixel-card{min-height:116px;padding:10px}
    .card-icon{font-size:42px}
    .card-name{font-size:28px}
    .card-count{font-size:17px}
    .pixel-button{padding:14px 18px;font-size:34px}
    .question-area{margin:20px 0;padding:36px}
    .action-button{min-height:112px;font-size:54px}
    .mini-note{margin-top:10px}
  }


  /* 메뉴 화면 전용 보정 */
  #menuScreen .content{
    justify-content:center;
    gap:clamp(12px,1.6vw,20px);
  }
  #menuScreen .title-box{
    margin-bottom:clamp(10px,1.6vw,18px);
  }
  #menuScreen .menu-grid{
    flex:0 0 auto;
    align-content:center;
  }
  #menuScreen .bottom-row{
    flex:0 0 auto;
    margin-top:clamp(10px,1.5vw,16px);
  }
  #menuScreen .bottom-row .pixel-button{
    padding:clamp(12px,1.5vw,18px);
    font-size:clamp(24px,3vw,38px);
  }

  @media(max-height:760px) and (min-width:901px){
    #menuScreen .content{
      padding:18px 34px;
      justify-content:center;
      gap:12px;
    }
    #menuScreen .title-box{
      width:min(620px,88%);
      padding:12px 18px;
      margin-bottom:10px;
      box-shadow:8px 8px 0 #111;
    }
    #menuScreen .main-title{
      font-size:56px;
    }
    #menuScreen .sub-title{
      font-size:22px;
      margin-top:6px;
    }
    #menuScreen .menu-grid{
      gap:14px 18px;
    }
    #menuScreen .pixel-card{
      min-height:118px;
      padding:10px 8px;
    }
    #menuScreen .card-icon{
      font-size:40px;
    }
    #menuScreen .card-name{
      font-size:26px;
    }
    #menuScreen .card-count{
      font-size:16px;
    }
    #menuScreen .bottom-row{
      margin-top:8px;
    }
    #menuScreen .bottom-row .pixel-button{
      padding:12px 14px;
      font-size:30px;
    }
  }

</style>
</head>
<body>
<div class="app">
  <section class="screen active" id="menuScreen"><div class="panel"><div class="content"><div class="title-box"><div class="main-title">몸으로 말해요</div><div class="sub-title">BLOCK CHALLENGE</div></div><div class="menu-grid" id="categoryGrid"></div><div class="bottom-row"><button class="pixel-button option-button" onclick="showScreen('howScreen')">게임 방법</button><button class="pixel-button start-button" onclick="startWithAll()">전체 랜덤</button></div></div></div></section>
  <section class="screen" id="timeScreen"><div class="panel"><div class="content"><button class="pixel-button back-button" onclick="showScreen('menuScreen')">← 메뉴</button><div class="select-title" id="selectedCategoryTitle">시간 선택</div><div class="time-grid"><button class="pixel-button time-button" onclick="startGame(60)"><strong>60</strong><span>빠른 도전</span></button><button class="pixel-button time-button" onclick="startGame(90)"><strong>90</strong><span>기본 모드</span></button><button class="pixel-button time-button" onclick="startGame(120)"><strong>120</strong><span>여유 있게</span></button></div></div></div></section>
  <section class="screen" id="gameScreen"><div class="panel"><div class="content"><div class="hud"><div class="hud-left" id="gameCategory">물건</div><div class="hud-center" id="timer">90</div><div class="hud-right">⭐ <span id="score">0</span>점</div></div><div class="question-area"><div class="question-word" id="questionWord">선풍기</div></div><div class="action-grid"><button class="action-button pass-button" onclick="passQuestion()">PASS</button><button class="action-button correct-button" onclick="correctQuestion()">정답!</button></div><div class="mini-note">키보드 단축키: P = PASS / Enter 또는 Space = 정답 / Esc = 종료</div></div></div></section>
  <section class="screen" id="resultScreen"><div class="panel"><div class="content"><div class="result-card"><div class="result-title">MISSION COMPLETE!</div><div class="score"><span id="finalScore">0</span>점</div><div class="badge" id="badge">BLOCK ROOKIE</div><div class="result-info">정답 <span id="finalCorrect">0</span>개 · PASS <span id="finalPass">0</span>개</div><div class="bottom-row"><button class="pixel-button option-button" onclick="restartGame()">다시 도전</button><button class="pixel-button start-button" onclick="showScreen('menuScreen')">메뉴로</button></div></div></div></div></section>
  <section class="screen" id="howScreen"><div class="panel"><div class="content"><button class="pixel-button back-button" onclick="showScreen('menuScreen')">← 메뉴</button><div class="result-card"><div class="result-title">게임 방법</div><div class="result-info" style="line-height:1.55;text-align:left">1. 카테고리를 선택합니다.<br>2. 제한 시간을 고릅니다.<br>3. 화면에 나온 단어를 말 없이 몸짓으로 설명합니다.<br>4. 맞히면 <b>정답!</b>, 어려우면 <b>PASS</b>를 누릅니다.<br>5. 시간이 끝나면 점수가 나옵니다.</div><button class="pixel-button start-button" onclick="showScreen('menuScreen')">시작하러 가기</button></div></div></div></section>
</div>
<script>
const categories={"동물":{icon:"🐾",words:["고양이","강아지","코끼리","기린","원숭이","펭귄","토끼","사자","호랑이","캥거루","개구리","독수리","상어","문어","거북이"]},"물건":{icon:"🎒",words:["선풍기","우산","가위","칫솔","의자","마이크","리모컨","시계","전화기","카메라","안경","책가방","컴퓨터","청소기","물병"]},"직업":{icon:"🧑‍🔧",words:["의사","경찰관","소방관","요리사","가수","배우","선생님","운동선수","유튜버","화가","간호사","조종사","농부","기자","프로그래머"]},"스포츠":{icon:"🏆",words:["축구","농구","야구","배드민턴","수영","태권도","스케이트","볼링","탁구","배구","양궁","스키","마라톤","줄넘기","골프"]},"음식":{icon:"🍽️",words:["피자","라면","김밥","떡볶이","햄버거","아이스크림","치킨","초밥","짜장면","팝콘","케이크","바나나","감귤","만두","핫도그"]},"탈것":{icon:"🚀",words:["자동차","버스","비행기","자전거","기차","배","오토바이","킥보드","헬리콥터","트럭","택시","지하철","구급차","소방차","로켓"]},"속담":{icon:"💬",words:["가는 말이 고와야 오는 말이 곱다","낮말은 새가 듣고 밤말은 쥐가 듣는다","티끌 모아 태산","돌다리도 두들겨 보고 건너라","하늘의 별 따기","소 잃고 외양간 고친다","원숭이도 나무에서 떨어진다","고래 싸움에 새우 등 터진다"]},"느낌":{icon:"✨",words:["기쁘다","슬프다","화나다","무섭다","부끄럽다","졸리다","신나다","놀라다","아프다","심심하다","답답하다","자랑스럽다","긴장된다","행복하다","억울하다"]}};
let selectedCategory=null,currentWords=[],usedWords=[],score=0,pass=0,timeLeft=90,selectedTime=90,timerId=null,currentWord="";
const $=id=>document.getElementById(id);
function showScreen(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));$(id).classList.add("active");if(id!=="gameScreen")clearInterval(timerId)}
function buildCategories(){const grid=$("categoryGrid");grid.innerHTML="";Object.entries(categories).forEach(([name,data])=>{const btn=document.createElement("button");btn.className="pixel-card";btn.innerHTML=`<div class="card-icon">${data.icon}</div><div class="card-name">${name}</div><div class="card-count">${data.words.length}문제</div>`;btn.onclick=()=>selectCategory(name);grid.appendChild(btn)})}
function selectCategory(name){selectedCategory=name;currentWords=[...categories[name].words];$("selectedCategoryTitle").textContent=`${categories[name].icon} ${name} 시간 선택`;showScreen("timeScreen")}
function startWithAll(){selectedCategory="전체 랜덤";currentWords=Object.values(categories).flatMap(c=>c.words);$("selectedCategoryTitle").textContent="🎲 전체 랜덤 시간 선택";showScreen("timeScreen")}
function startGame(seconds){selectedTime=seconds;timeLeft=seconds;score=0;pass=0;usedWords=[];$("score").textContent=score;$("timer").textContent=timeLeft;$("gameCategory").textContent=selectedCategory;showScreen("gameScreen");nextQuestion();clearInterval(timerId);timerId=setInterval(()=>{timeLeft--;$("timer").textContent=timeLeft;if(timeLeft<=0)endGame()},1000)}
function nextQuestion(){if(currentWords.length===0){currentWords=usedWords.length?[...usedWords]:Object.values(categories).flatMap(c=>c.words);usedWords=[]}const index=Math.floor(Math.random()*currentWords.length);currentWord=currentWords.splice(index,1)[0];usedWords.push(currentWord);$("questionWord").textContent=currentWord;$("questionWord").classList.remove("long","very-long");if(currentWord.length>=14){$("questionWord").classList.add("very-long")}else if(currentWord.length>=7){$("questionWord").classList.add("long")}}
function correctQuestion(){score++;$("score").textContent=score;nextQuestion()}
function passQuestion(){pass++;nextQuestion()}
function endGame(){clearInterval(timerId);$("finalScore").textContent=score;$("finalCorrect").textContent=score;$("finalPass").textContent=pass;$("badge").textContent=getBadge(score);showScreen("resultScreen")}
function restartGame(){startGame(selectedTime)}
function getBadge(score){if(score>=20)return"💎 BLOCK MASTER";if(score>=15)return"🏆 GOLD EXPLORER";if(score>=10)return"🥈 SILVER BUILDER";if(score>=5)return"🥉 BRONZE PLAYER";return"🌱 BLOCK ROOKIE"}
document.addEventListener("keydown",e=>{if(!$("gameScreen").classList.contains("active"))return;if(e.key==="Enter"||e.code==="Space"){e.preventDefault();correctQuestion()}if(e.key.toLowerCase()==="p")passQuestion();if(e.key==="Escape")endGame()});
buildCategories();
</script>
</body>
</html>
