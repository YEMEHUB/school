<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>복사 버튼</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none !important;}

body{
  margin:0;
  padding:10px 16px;
  background:#eef2f7;
  font-family:Arial,"Noto Sans KR",sans-serif;
}
.wrap{
  width:min(720px,100%);
  margin:0 auto;
}
.create,
.copy-button{
  width:100%;
  min-height:48px;
  border:0;
  border-radius:18px;
  background:#fff2d8;
  color:#985900;
  padding:14px 14px;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}
.create{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.copy-button{
  text-align:left;
}
.copy-button:active{transform:scale(.995)}

dialog{
  width:min(560px,calc(100% - 28px));
  border:0;
  border-radius:20px;
  padding:0;
  box-shadow:0 18px 60px rgba(0,0,0,.18)
}
dialog::backdrop{background:rgba(15,23,42,.45)}
.modal{padding:22px}
.modal h2{margin:0 0 18px;font-size:22px}
.field{display:grid;gap:7px;margin-bottom:14px}
.field label{font-weight:800;font-size:14px;color:#17233a}
input,textarea{
  width:100%;
  border:1px solid #cfd5df;
  border-radius:12px;
  padding:12px;
  font:inherit;
  font-size:16px
}
textarea{min-height:180px;resize:vertical}
.modal-actions{display:flex;justify-content:flex-end;gap:8px}
.btn{
  border:1px solid #e5e7eb;
  background:#fff;
  border-radius:10px;
  padding:10px 12px;
  font-weight:700;
  cursor:pointer
}
.btn.primary{
  background:#fff2d8;
  color:#985900;
  border:0
}
.toast{
  margin-top:10px;
  width:100%;
  text-align:center;
  background:#111827;
  color:#fff;
  padding:10px 14px;
  border-radius:12px;
  display:none;
  font-weight:700;
  font-size:14px;
}
</style>
</head>
<body>
<main class="wrap">
  <button id="createBtn" class="create" type="button">
    <span>새 복사 버튼</span>
    <span>+ 만들기</span>
  </button>

  <button id="copyBtn" class="copy-button" type="button" hidden></button>
  <div id="toast" class="toast" role="status" aria-live="polite">복사되었습니다.</div>
</main>

<dialog id="dlg">
  <form id="form" class="modal">
    <h2 id="dlgTitle">새 복사 버튼 만들기</h2>

    <div class="field">
      <label for="name">버튼 제목</label>
      <input id="name" required placeholder="예: 2차시 결과물 내용복사하기">
    </div>

    <div class="field">
      <label for="content">복사할 내용</label>
      <textarea id="content" required placeholder="복사할 문장이나 프롬프트를 입력하세요."></textarea>
    </div>

    <div class="modal-actions">
      <button id="cancelBtn" class="btn" type="button">취소</button>
      <button class="btn primary" type="submit">저장</button>
    </div>
  </form>
</dialog>


<script>
const KEY = "yeme-single-copy-button-v2";

const createBtn = document.getElementById("createBtn");
const copyBtn = document.getElementById("copyBtn");
const dlg = document.getElementById("dlg");
const form = document.getElementById("form");
const nameEl = document.getElementById("name");
const contentEl = document.getElementById("content");
const cancelBtn = document.getElementById("cancelBtn");
const toast = document.getElementById("toast");

let data = null;

try {
  const saved = localStorage.getItem(KEY);
  data = saved ? JSON.parse(saved) : null;
} catch(e) {
  data = null;
}

function render(){
  const exists = !!(data && data.name && data.content);

  if(exists){
    createBtn.setAttribute("hidden", "");
    copyBtn.removeAttribute("hidden");
    copyBtn.textContent = data.name;
  }else{
    copyBtn.setAttribute("hidden", "");
    createBtn.removeAttribute("hidden");
  }
}

function showToast(text){
  toast.textContent = text;
  toast.style.display = "block";
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(()=>toast.style.display="none",1300);
}

async function copyText(text){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand("copy");
      ta.remove();
    }
    showToast("복사되었습니다.");
  } catch(e){
    showToast("복사에 실패했어요.");
  }
}

createBtn.addEventListener("click", ()=>{
  nameEl.value = "";
  contentEl.value = "";
  document.getElementById("dlgTitle").textContent = "새 복사 버튼 만들기";
  dlg.showModal();
  setTimeout(()=>nameEl.focus(),20);
});

copyBtn.addEventListener("click", ()=>{
  if(data) copyText(data.content);
});

/* 더블클릭 시 수정 */
copyBtn.addEventListener("dblclick", ()=>{
  if(!data) return;
  nameEl.value = data.name;
  contentEl.value = data.content;
  document.getElementById("dlgTitle").textContent = "복사 버튼 수정하기";
  dlg.showModal();
});

cancelBtn.addEventListener("click", ()=>dlg.close());

form.addEventListener("submit", (e)=>{
  e.preventDefault();

  const name = nameEl.value.trim();
  const content = contentEl.value.trim();
  if(!name || !content) return;

  data = {name, content};
  localStorage.setItem(KEY, JSON.stringify(data));

  dlg.close();
  render();
  showToast("만들었습니다!");
});

render();
</script>
</body>
</html>
